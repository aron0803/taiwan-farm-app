  .content { padding: 1.1rem 1.1rem 0; display: flex; flex-direction: column; gap: 1.1rem; }

  .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] {

    border-color: var(--leaf);

  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .back-btn {

    border: none;
    color: var(--ink-soft);

    font-family: inherit;
    padding: 0;
    margin-bottom: 0.2rem;
    cursor: pointer;
  }
  .back-btn:hover, .back-btn:focus-visible { color: var(--leaf); outline: none; }

  .sheet { display: flex; flex-direction: column; gap: 1.5rem; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 0.9rem;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .masthead .id {

    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .crop-name {

    font-weight: 700;
    margin: 0.15rem 0 0;

    padding: 0.3rem 0.7rem;

    font-size: 0.82rem;
    color: var(--ink-soft);

    background: var(--surface-2);
    border-radius: 999px;

 "qa", "fetched_date": "2026-08-19"}, {"id": 67, "crop_id": "huluobo", "field": "水分管理", "value": "前期不能施水過量以防地面部分生長過度；後期需供水充足使肉質根充分發育；採收前忌灌水", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8993", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 68, "crop_id": "huluobo", "field": "中耕培土", "value": "發芽後50天內輕度中耕培土；發芽後65～70天需培土至根肩處", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8993", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 69, "crop_id": "qiezi", "field": "適合溫度", "value": "幼苗期白天20～25℃、夜間17℃以上；15℃以下生長緩慢易落花，10℃以下停止生長", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2847", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 70, "crop_id": "qiezi", "field": "水分管理", "value": "約7天灌溉一次，畦面保持濕潤；過乾降低果實品質使果皮過硬，過濕易使根部腐爛", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2847", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 71, "crop_id": "qiezi", "field": "整枝摘葉", "value": "定植後20～35天去除始花節位以下之葉片及蘗芽；始花期採雙幹或V型整枝；定植1個月後每株立1支柱", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2847", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 72, "crop_id": "qiezi", "field": "施肥", "value": "基肥於整地前全圃撒施；追肥自開始採收後每7～10天施1次，冬天間隔長、夏天間隔短", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2847", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 73, "crop_id": "qiezi", "field": "採收時機", "value": "茄果長達30公分以上、色澤亮麗、果實頂端撐開萼片時採收，約每2～3天採收一次，以清晨或傍晚為佳", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2847", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 74, "crop_id": "tianjiao", "field": "適合季節", "value": "秋作最適合；春夏之際多雨高濕、高溫栽培較困難，宜於高冷地栽培；冬作氣溫低且溫度不穩定", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1623", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 75, "crop_id": "tianjiao", "field": "適合溫度", "value": "生育適溫22～30℃，果實生育最佳20～25℃，日溫最佳27℃、夜溫最佳20℃（夜溫低於15℃果實尾部會變尖）", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1623", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 76, "crop_id": "tianjiao", "field": "土壤條件", "value": "排水良好、肥沃的壤土，中性微酸土壤為宜", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1623", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 77, "crop_id": "tianjiao", "field": "種植方式與株距", "value": "平地秋冬作：寬畦含畦溝150公分寬，雙行植行株距75×45公分；高冷地夏作：寬畦含畦溝120公分寬，單行植株距40公分", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1623", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 78, "crop_id": "tianjiao", "field": "施肥", "value": "每十公畝施用2000公斤堆肥及100公斤43號複合肥料做基肥", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1623", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 79, "crop_id": "tianjiao", "field": "採收天數", "value": "開花至轉色完全約需75天或更長", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1623", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 80, "crop_id": "tianjiao", "field": "全國產期", "value": "全年1～12月均有產出，產地含新竹、台中、彰化、南投、雲林、嘉義、高雄、屏東、台東等地", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=41", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 81, "crop_id": "yangcong", "field": "適合季節", "value": "秋冬季到隔年春季，須選短日型品種因應台灣日照較短", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=12924", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 82, "crop_id": "yangcong", "field": "適合溫度", "value": "種子發芽適溫16～25℃，根群發育適溫15～20℃，莖葉發育適溫20～26℃，生育最適溫度20～25℃", "source_name": "農業知識入口網", 8915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 154, "crop_id": "wandou", "field": "排水", "value": "排水良好土地畦高10～15公分；排水較差土地建議做20～30公分高畦", "source_name": "農業知識入口網（豌豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=38915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 155, "crop_id": "wandou", "field": "施肥", "value": "苗期需施用足量氮肥，開花結莢後繼續供氮可提高產量", "source_name": "農業知識入口網（豌豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=38915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 156, "crop_id": "wandou", "field": "水分管理", "value": "結莢期間可減少灌溉次數，土壤水分太充足易促進莖葉生長而不利結莢", "source_name": "農業知識入口網（豌豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=38915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 157, "crop_id": "wandou", "field": "採收天數", "value": "嫩莢豌豆早生品種播種後60天、中生70天；甜豌豆早生70天、中生80天、晚生90天；豌豆苗播種後30～40天開始採收", "source_name": "農業知識入口網（豌豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=38915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 158, "crop_id": "maodou", "field": "全國產期", "value": "2、3、4、9、10、11月", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=154", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 159, "crop_id": "maodou", "field": "採收標準", "value": "八分飽滿時採收，此時豆莢仍翠綠且外有茸毛", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=154", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 160, "crop_id": "maodou", "field": "主要產地", "value": "屏東縣（崁頂鄉，種植面積最大3,783.89公頃）、雲林縣（2,400.86公頃）、彰化縣（62.99公頃）", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=154", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 161, "crop_id": "ganju", "field": "各品種產期", "value": "檸檬/萊姆全年生產；麻豆文旦8月下旬起採收；椪柑10月起上市；柳橙11月起採收；桶柑/茂谷柑2月起上市；晚崙西亞3、4月上市", "source_name": "農業知識入口網（柑橘主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=6177", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 162, "crop_id": "ganju", "field": "各品種主要產地", "value": "椪柑：苗栗/台中/雲林/嘉義/台南；柳橙：南投/雲林/嘉義/台南；桶柑：宜蘭/新竹/苗栗/台中/花蓮/台東；麻豆文旦：花蓮/台南/苗栗/宜蘭；檸檬：屏東；海梨柑：新竹特產；金柑：宜蘭特產；白柚：台南/台東/嘉義；晚崙西亞：台東特產", "source_name": "農業知識入口網（柑橘主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=6177", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 163, "crop_id": "mangguo", "field": "生育週期（屏東）", "value": "6～7月開始抽梢，9～10月停梢，開花著果期12～2月", "source_name": "農業知識入口網（芒果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=10690", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 164, "crop_id": "mangguo", "field": "生育週期（高雄、台南以北）", "value": "7～8月抽梢，10～11月停梢，開花著果期2～3月", "source_name": "農業知識入口網（芒果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=10690", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 165, "crop_id": "mangguo", "field": "開花著果期長度", "value": "自花序抽長後起維持約45天，花期後約1個月進入結果期", "source_name": "農業知識入口網（芒果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=10690", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 166, "crop_id": "mangguo", "field": "採收期（依品種）", "value": "土芒果約6月之前；愛文/玉文/金煌/夏雪/蜜雪5月(屏東)至7月(台南)；慢愛文/聖心/蘋果文7月底至8月；凱特/紅凱特8～9月；四季芒果6～7月(未調節)或11～2月(經產期調節)", "source_name": "農業知識入口網（芒果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=10690", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 167, "crop_id": "mangguo", "field": "苗木定植適期", "value": "3～10月均可進行，應避免連續雨季及颱風天定植；冬季（尤其寒流期間）苗木處於停梢狀態，種植後不易長新根，應避免冬季定植", "source_name": "農業知識入口網（芒果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=10855", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 168, "crop_id": "mangguo", "field": "定植方式", "value": "植穴長寬深各約50公分，表土底土分開回填並施有機質肥料及少許化肥當基肥；種植深度以根頸與地面平行為準，定植後需澆水直至成活", "source_name": "農業知識入口網（芒果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=10855", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 169, "crop_id": "mugua", "field": "土壤條件", "value": "對土壤要求不嚴、適應性強，以土質肥沃、水源充足、排水便利為宜；不可種在會積水或淹水的地方", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=511", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 170, "crop_id": "mugua", "field": "種植方式", "value": "採用種子育苗或扦插成苗後移栽，生長3～5年後開花結果；需種植兩性株才有利結果，雌性株需人工授粉", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=511", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 171, "crop_id": "mugua", "field": "株距", "value": "1～1.2公尺", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=511", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 172, "crop_id": "mugua", "field": "施肥", "value": "施磷肥促進開花，施肥位置離根部遠一點；建議分東西南北四區輪流施肥避免過量肥料傷害", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=511", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 173, "crop_id": "mugua", "field": "定植適期", "value": "春植(2～3月)或秋植(9～11月)最適合，秋植較易成功；全年皆可定植，月份僅表示生育階段時間，開花結果期及成熟採收期為連續性", "source_name": "食農教育資訊整合平臺", "source_url": "https://fae.moa.gov.tw/map/food_item.php?type=AS04&id=51", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 174, "crop_id": "fengli", "field": "種植時間換算", "value": "種植時間需依目標採收月份反推，例如欲翌年4月採收（台農17號）則於前一年10月種植；早春定植僅能用冠芽及吸芽繁殖，年底種植則冠芽/裔芽/吸芽皆可用", "source_name": "農業知識入口網（鳳梨主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=5967", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 175, "crop_id": "fengli", "field": "種植密度", "value": "二列式三角形密植，每公頃3萬5,000至4萬株苗；畦距約100公分，行距約50公分，株距36～30公分", "source_name": "農業知識入口網（鳳梨主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=5967", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 176, "crop_id": "lianwu", "field": "苗木定植季節", "value": "2～3月或10～11月為宜", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=62", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 177, "crop_id": "lianwu", "field": "適合溫度", "value": "性喜溫暖怕寒冷，遇10℃以下低溫易造成寒害", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=62", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 178, "crop_id": "lianwu", "field": "土壤條件", "value": "壤土果園保肥力佳、成本低，較易控制植株徒長", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=62", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 179, "crop_id": "lianwu", "field": "種植方式與株距", "value": "寬行栽植，行距7～8公尺，株距5.5公尺", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=62", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 180, "crop_id": "lianwu", "field": "生長特性", "value": "生長勢強，每年抽新梢6～7次，每次間隔依溫度而定需50～60天", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=62", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 181, "crop_id": "lianwu", "field": "施肥", "value": "採收後給予「禮肥」；整枝修剪期間給予基肥；開花著果後給予追肥", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=62", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 182, "crop_id": "yumi", "field": "適合季節（南部）", "value": "1月下旬～3月中旬、9月上中旬（兩次產期）；超甜玉米適播期9月上旬至10月上旬", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3581", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 183, "crop_id": "yumi", "field": "株距與播種量", "value": "行株距80×25公分，每公頃播種量15公斤", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3581", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 184, "crop_id , "fetched_date": "2026-08-19"}, {"id": 192, "crop_id": "xiangjiao", "field": "整地", "value": "排水不良處應先作高畦；挖深度約20～30公分穴種植，使苗的塊莖深入土中", "source_name": "農業知識入口網（香蕉主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=11046", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 193, "crop_id": "lvhuaqielan", "field": "⚠️品種播種適期（此為花椰菜資料非青花菜專屬）", "value": "早生品種7～9月播種育苗，中生品種9～10月，晚生品種10～12月", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=30125", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 194, "crop_id": "jiucai", "field": "適合季節", "value": "播種適期11月至翌年3月，分株法適期11～12月；台灣目前全年均可栽培，但以冬春季品質較佳", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9436", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 195, "crop_id": "jiucai", "field": "適合溫度", "value": "生育適溫15～25℃", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9436", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 196, "crop_id": "jiucai", "field": "採收週期", "value": "播種後約4個月可第1次採收；割取地上切口後再培育40天左右可再收割，可循環採收多次", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9436", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 197, "crop_id": "jiucai", "field": "施肥（花蓮區農改場）", "value": "合理化施肥搭配有機質肥料及有益微生物菌，可降低肥料用量、降低病蟲發生率並提高品質，每公頃約可降低肥料成本6,500元", "source_name": "農業知識入口網（花蓮區農改場）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=news&sub_theme=agri_life&id=53794", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 198, "crop_id": "cong", "field": "適合季節", "value": "種植時期以8～10月播種為佳；北蔥全年均可種植，但以夏後為佳", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1498", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 199, "crop_id": "cong", "field": "適合溫度", "value": "種子發芽溫度範圍廣，以15～30℃最適宜", "source_name": "農業知識入口網", "source_url": "https://kmw rl": "https://kmweb.moa.gov.tw/subject/subject.php?id=57437", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 208, "crop_id": "dasuan", "field": "水分管理", "value": "初期(40天內)約5～7天灌水一次；中期(40～80天)約10～15天灌水一次；肥大初期(80～120天)約隔20天灌溉一次；肥大末期至成熟應停止灌水", "source_name": "農業知識入口網（大蒜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=57437", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 209, "crop_id": "dasuan", "field": "施肥", "value": "青蒜：播種後70天內分3次施用；蒜頭：90天內分3～4次施用", "source_name": "農業知識入口網（大蒜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=57437", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 210, "crop_id": "dasuan", "field": "採收天數", "value": "青蒜播種後80～100天；蒜球播植後約5個月，採收時地上莖葉有1/3至2/3黃萎", "source_name": "農業知識入口網（大蒜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=57437", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 211, "crop_id": "xigua", "field": "適合溫度", "value": "種子發芽適溫26～30℃，莖葉發育適溫24～30℃，果實發育成熟需28～32℃；生長適溫25～30℃，6～10℃易受寒害", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3863", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 212, "crop_id": "xigua", "field": "地理條件", "value": "月平均氣溫19℃以上的月份全年多於3個月的地區才可行露地栽培；台灣南部冬季氣溫仍適合栽種，深冬寒流時用稻草防寒可度過幼苗期並於初春採收", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3863", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 213, "crop_id": "xigua", "field": "植物特性", "value": "屬長日照植物，喜強光，適宜乾熱氣候，耐旱力強", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3863", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 214, "crop_id": "xigua", "field": "全國產期與產地", "value": "產期3～11月；產地含宜蘭大同、桃園觀音、苗栗後龍、彰化二林、雲林多鄉鎮、嘉義義竹、台南麻豆善化、高雄路竹阿蓮、花蓮鳳林壽豐玉里瑞穗", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=26", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 215, "crop_id": "jiecai", "field": "適合季節與溫度", "value": "主要栽培期為秋冬季，適合溫度16～22℃間生育最旺盛，日夜溫差大時品質最佳", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1497", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 216, "crop_id": "jiecai", "field": "土壤條件", "value": "砂質土，土層深厚，排水良好，pH值約5左右為適宜", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1497", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 217, "crop_id": "jiecai", "field": "種植方式", "value": "先用穴盤栽種，一穴一種子，發芽後一穴一苗，再移植到田間", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1497", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 218, "crop_id": "jiecai", "field": "水分管理", "value": "不缺水即可適應，水分過多會使肉質莖與根腐爛", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1497", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 219, "crop_id": "jiecai", "field": "施肥", "value": "有機質肥料每公頃施用1～1.5公噸加台肥5號800公斤；缺硼時用0.4%硼砂水溶液葉面施肥", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1497", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 220, "crop_id": "youcai", "field": "適合溫度", "value": "發芽適溫20～25℃，生育適溫15～20℃，生長初期喜溫暖濕潤", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?func=2&type=13229&keyword=&id=282792", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 221, "crop_id": "youcai", "field": "土壤條件", "value": "對土壤選擇不嚴，pH值5～8左右、排水良好且肥沃的土壤最適宜", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?func=2&type=13229&keyword=&id=282792", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 222, "crop_id": "youcai", "field": "播種量", "value": "每公頃約需種子6～9公斤", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?func=2&type=13229&keyword=&id=282792", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 223, "crop_id": "youcai", "field": "產期（台東地區）", "value": "二期稻作收穫後(11月下旬)至立春(2月上旬)為種植生長期，開花期約45天", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?func=2&type=13229&keyword=&id=282792", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 224, "crop_id": "lizhi", "field": "適合定植季節", "value": "2～4月及10～11月為較適宜的定植期", "source_name": "農業知識入口網（荔枝主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24091", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 225, "crop_id": "lizhi", "field": "株距", "value": "採4×3公尺或4×4公尺行株距，亦建議可用5×5公尺", "source_name": "農業知識入口網（荔枝主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24091", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 226, "crop_id": "lizhi", "field": "定植方式", "value": "植穴30公分寬、30公分深，可混合完全腐熟牛糞堆肥3公斤，土壤回填需超過苗根圈上端10公分", "source_name": "農業知識入口網（荔枝主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24091", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 227, "crop_id": "lizhi", "field": "定植後灌溉", "value": "初期2個月密集灌溉每1～2天一次；第二次新梢成熟後可隔3天灌溉一次，維持1年", "source_name": "農業知識入口網（荔枝主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24091", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 228, "crop_id": "lizhi", "field": "施肥時機", "value": "定植時不可用化學肥料，需待第三次新梢生長後才能使用", "source_name": "農業知識入口網（荔枝主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24091", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 229, "crop_id": "lizhi", "field": "全台產期（依地區）", "value": "高屏地區最早5月初成熟；嘉南地區6月初；南投台中地區6月中下旬；新竹地區7月中上旬；中海拔山區（300-400公尺）8月初", "source_name": "農業知識入口網（荔枝主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24000", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 230, "crop_id": "longyan", "field": "嫁接繁殖", "value": "主要嫁接期1～3月，常用切接法，嫁接後氣溫回暖使根部枝梢開始活動生長，成活率高可縮短幼年期", "source_name": "農業知識入口網（龍眼主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=44974", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 231, "crop_id": "longyan", "field": "高壓繁殖", "value": "全年皆可進行，選適當枝條環剝後包覆水苔等保水介質，成活率高且保持原品種特性；但根系較淺分散，定植初期遇颱風較易傾倒", "source_name": "農業知識入口網（龍眼主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=44974", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 232, "crop_id": "longyan", "field": "種子繁殖", "value": "種子屬異儲型不耐乾燥，取出後需盡快播種，繁殖後代常需6年以上才開花結果，主要用於嫁接砧木培育或育種", "source_name": "農業知識入口網（龍眼主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=44974", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 233, "crop_id": "longyan", "field": "花芽分化", "value": "分化期約12月至1月，結果母枝需感受15～22℃涼溫持續8～10週，頂端休眠芽才由葉芽轉為花芽", "source_name": "農業知識入口網（龍眼主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=44982", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 234, "crop_id": "longyan", "field": "採收適期", "value": "果皮由青色轉淡褐色、粗糙轉光滑、輕壓有彈性即為採收適期；過早風味未達最佳，過晚甜度下降（俗稱「退甘」）", "source_name": "農業知識入口網（龍眼主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=44985", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 235, "crop_id": "baixiangguo", "field": "播種適期", "value": "一年四季皆可播種，在台灣以8、9月或2、3月最合適；種子需浸水發酵不超過3天，播種後約10～14天發芽", "source_name": "農業知識入口網（百香果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=40168", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 236, "crop_id": "baixiangguo", "field": "扦插繁殖", "value": "全年可進行，以3～4月與9～10月最合適，利用去年生成熟枝條，約30天後可長根", "source_name": "農業知識入口網（百香果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=40168", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 237, "crop_id": "baixiangguo", "field": "定植與開花結果", "value": "更新定植時間大多於2～3月（集中元宵節前後）；第一批花約5月開放，著果後55～60天成熟自然掉落", "source_name": "農業知識入口網（百香果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=40148", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 238, "crop_id": "baixiangguo", "field": "產期", "value": "正常期作採收落於盛夏7月，可持續採收至隔年春節前；設施栽培結合冬季電照技術可使產期集中於當年7月至隔年2月", "source_name": "農業知識入口網（百香果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=40148", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 239, "crop_id": "huolongguo", "field": "土壤條件", "value": "含腐殖質多、保水保肥的中性或弱酸性土壤為好；含沙率40～70%的通風透光坡地佳", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3483", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 240, "crop_id": "huolongguo", "field": "適合溫度", "value": "最佳適宜溫度20～30℃；北方種植須建溫室大棚，冬季夜間溫度不低於8℃", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3483", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 241, "crop_id": "huolongguo", "field": "種植方式與株距", "value": "柱式栽培為主，每柱周圍種4株苗，畝栽300～400株，柱高2米水泥柱作支架", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3483", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 242, "crop_id": "huolongguo", "field": "施肥", "value": "苗期施薄肥，每7～10天施一次複合肥", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3483", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 243, "crop_id": "shanyao", "field": "適合季節", "value": "無性繁殖於清明節前後或2～4月間進行；塊莖生長發育於11～12月達最高峰", "source_name": "農業知識入口網（保健植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=17915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 244, "crop_id": "shanyao", "field": "適合溫度", "value": "種薯發芽適溫約17～18℃，莖蔓生長適溫約25～26℃，新薯塊發育適溫約22～23℃", "source_name": "農業知識入口網（保健植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=17915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 245, "crop_id": "shanyao", tps://kmweb.moa.gov.tw/subject/subject.php?id=26447", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 370, "crop_id": "luoshenkui", "field": "產期（依熟期）", "value": "早生種8～9月，中生種10～11月，晚生種12月至翌年1月，盛產期8～10月", "source_name": "農業知識入口網（洛神葵主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=26447", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 371, "crop_id": "kafei", "field": "播種與定植適期", "value": "種子可秋季10～12月及春季2～4月間播種，發芽率50～80%；植株定植時間以12～3月最適合，雨季前種植有助樹苗存活", "source_name": "農業知識入口網（咖啡主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=45553", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 372, "crop_id": "kafei", "field": "發芽時間", "value": "新鮮種子播種後5～8星期發芽", "source_name": "農業知識入口網（咖啡主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=45553", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 373, "crop_id": "kafei", "field": "株距（依品種）", "value": "阿拉比卡2.5×2.5公尺(約1,600株/公頃)；羅布斯塔3.0×3.0公尺(約1,100株/公頃)；賴比瑞亞3.5×3.5公尺(約800株/公頃)", "source_name": "農業知識入口網（咖啡主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=45553", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 374, "crop_id": "kafei", "field": "適合溫度與環境", "value": "適應16～28℃之間溫度，栽培環境需涼爽通風、有樹蔭或防風樹，年降雨量1500～2500毫米較適宜", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=6018", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 375, "crop_id": "kafei", "field": "花期與採收", "value": "每年國曆2、3月為花期，開花後結綠色果實，農曆中秋過後由綠轉紅開始收成；低海拔採收期10月至12月中旬，高海拔可延至翌年3、4月", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=6018", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 376, "crop_id": "lingjiao", "field": "全國產期", "value": "產期8月開始，9～11月為盛產期，每2週採收一次共6～7輪", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=113", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 377, "crop_id": "lingjiao", "field": "主要產區", "value": "台南官田為全國最大產區，栽培面積約353公頃，年產量約4,000公噸，占全國約90%", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=113", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 378, "crop_id": "yelian", "field": "種植方式", "value": "須於魚塭或池塘中栽培，進水口需加裝濾網過濾雜物並防治福壽螺；莖長可達130公分以上，由節處長出不定根繁殖", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=news&sub_theme=agri_life&id=52453", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 379, "crop_id": "yelian", "field": "生長週期", "value": "夏季生長較快約2個月可採收，冬季生長較慢約3個月，換季種植之間會曬池數天，一年可採收3～4次", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=news&sub_theme=agri_life&id=52453", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 380, "crop_id": "yelian", "field": "採收方式", "value": "先將水位降到約手臂高度，伸手觸及假莖底下根部自根部整株拔起，再經剪根、清洗、分級、秤重、包裝", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=news&sub_theme=agri_life&id=52453", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 381, "crop_id": "shudou", "field": "生育特性", "value": "耐貧瘠、乾旱，不耐寒忌霜害；根系淺易受風害，應選避風地區種植", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37351", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 382, "crop_id": "shudou", "field": "開花結莢特性", "value": "花序屬無限型生長，開花、結莢及豆莢成熟時間參差不一，採收無法一致；花果期春、夏間", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37351", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 383, "crop_id": "shudou", "field": "分布地區", "value": "台灣各地零星栽培，大多於海拔1,000公尺以下淺山坡地、丘陵地及河床地", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37351", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 384, "crop_id": "taiwanli", "field": "生育特性", "value": "植株生長強健，耐旱性及耐瘠性極佳，生長期短，播種後90～100天即可成熟（依季節及品系而異）", "source_name": "農業知識入口網（原住民族農產業主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39491", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 385, "crop_id": "taiwanli", "field": "栽培背景", "value": "台灣原生種植物，原住民部落耕種百年以上歷史，常作為小米、玉米伴生作物；籽實富含天然色素", "source_name": "農業知識入口網（原住民族農產業主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39491", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 386, "crop_id": "xiaomi", "field": "適合季節", "value": "台灣以春、秋兩作皆可種植，但春作產量較秋作佳", "source_name": "農業知識入口網（小米及台灣藜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=32193", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 387, "crop_id": "xiaomi", "field": "適合溫度", "value": "發芽最低溫7℃，以18～24℃發芽最快，可在-2℃至-3℃之早霜下生長", "source_name": "農業知識入口網（小米及台灣藜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=32193", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 388, "crop_id": "xiaomi", "field": "土壤條件", "value": "有機質含量豐富、排水良好、微酸性或中性(pH4.9～6.2)之壤土或砂質壤土", "source_name": "農業知識入口網（小米及台灣藜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=32233", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 389, "crop_id": "xiaomi", "field": "生育期與水分", "value": "生育期3.5～4個月，一年可兩作；臨界需水期為拔節至開花期、及籽實形成期", "source_name": "農業知識入口網（小米及台灣藜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=32231", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 390, "crop_id": "ningmeng", "field": "全國產期", "value": "經產期調節全年均可生產，盛產期6～8月；主要開花期12～2月，10～12月亦為盛產期", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=152", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 391, "crop_id": "ningmeng", "field": "土壤與品種", "value": "台灣主要品種優利卡(Eureka)容易周年開花結果，俗稱四季檸檬；土壤以排水砂質壤土較合適，pH5.5～7.0為宜", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3348", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 392, "crop_id": "ningmeng", "field": "採收標準", "value": "果實長到直徑約5.5～6公分，或果汁率35%以上即可採收", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3348", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 393, "crop_id": "hongcongtou", "field": "適合季節", "value": "最佳種植季節為秋季，但台灣幾乎全年可種植", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=16506", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 394, "crop_id": "hongcongtou", "field": "適合溫度", "value": "發芽適溫15～30℃，以20℃最適合", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=16506", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 395, "crop_id": "hongcongtou", "field": "土壤條件", "value": "黏質壤土較適合，pH5.7～7.4", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=16506", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 396, "crop_id": "hongcongtou", "field": "種球休眠與採收", "value": "種球需日照6週以上休眠期才能再種；第一次採收葉莖約需1個月", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=16506", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 397, "crop_id": "lajiao", "field": "適合季節", "value": "全年皆可栽種，考量本土季風氣候以春作及初秋較合適", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=14506", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 398, "crop_id": "lajiao", "field": "適合溫度", "value": "種子發芽適溫25～30℃，生長溫度範圍15～30℃，最適溫度約25℃", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=14506", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 399, "crop_id": "lajiao", "field": "土壤條件", "value": "pH5.5～6.8皆適宜，根系發達適合土層深厚、排水優良的砂質壤土", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=14506", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 400, "crop_id": "lajiao", "field": "水分管理", "value": "不耐濕不耐旱，需定期澆水但不能積水，水分管理很重要", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=14506", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 401, "crop_id": "lajiao", "field": "採收", "value": "果實充分肥大時為最佳採收期，採收期約可達3個月", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=14506", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 402, "crop_id": "qingjiangcai", "field": "適合季節", "value": "除嚴冬外整年皆可栽培；春秋季播種45～50天、夏季35～40天可收成", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2374", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 403, "crop_id": "qingjiangcai", "field": "播種方式", "value": "直播後疏苗或苗盆培育後移植；行距10～15公分、株距5公分，每洞點播4～5粒種子", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2374", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 404, "crop_id": "qingjiangcai", "field": "疏苗步驟", "value": "一週後疏苗每洞留3株；兩週後本葉3～4片時留2株；三週後株根膨脹時只留1株", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2374", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 405, "crop_id": "qingjiangcai", "field": "水肥管理", "value": "不耐乾燥需勤澆水，生長快速需不斷施肥，肥料撒在行間", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2374", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 406, "crop_id": "qingjiangcai", "field": "採收時機", "value": "長到約15公分、近株根處變結實時即可收成", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2374", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 407, "crop_id": "qincai", "field": "適合季節", "value": "全年生產之葉菜類，盛產期春、秋、冬季，夏季需中高海拔或降溫設施才容易生長", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=155", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 408, "crop_id": "qincai", "field": "品種", "value": "台灣常栽培黃梗菜、青梗菜、芹菜管三種，其中黃梗種葉梗黃白色粗長，可食性最高", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=155", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 409, "crop_id": "bianbu", "field": "適合溫度", "value": "種子發芽適溫25～30℃，生長發育適溫25～28℃，結果適溫20～25℃；持續高溫35℃或低溫15℃左右發育會受阻", "source_name": "農業知識入口網（扁蒲主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24666", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 410, "crop_id": "bianbu", "field": "整枝摘心", "value": "母蔓長至6～7葉片時摘心，留健壯子蔓3～4條，子蔓長至5～6葉時再進行第二次摘心", "source_name": "農業知識入口網（扁蒲主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24666", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 411, "crop_id": "bianbu", "field": "採收時機", "value": "食用幼嫩果實，夏天雌花開花後6～8天為採收適期，秋冬季則8～10天", "source_name": "農業知識入口網（扁蒲主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=24666", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 412, "crop_id": "hugua", "field": "產期（高屏地區）", "value": "周年可以生產，往年以秋冬裡作為主要產期，盛產季節集中冬、春兩季", "source_name": "農業知識入口網（農產品產期產地）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=158", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 413, "crop_id": "hugua", "field": "栽培方式", "value": "分露天栽培、網室栽培及設施栽培；設施栽培屋頂覆蓋透明塑膠布可阻擋雨水傳播病害（如露菌病、炭疽病），四周防蟲網防止害蟲進入", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?func=2&type=12925&id=316535", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 414, "crop_id": "hugua", "field": "採收技術", "value": "播種後40～45天開花，開花後5～7天、果實長16～18公分時採收，宜清晨或傍晚採收，每日可採，每0.1公頃產量可達2,500～3,000公斤", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?func=2&type=12925&id=316535", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 415, "crop_id": "jianghuang", "field": "適合季節", "value": "種植適期一般3～5月，以4月份種植最佳", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37486", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 416, "crop_id": "jianghuang", "field": "土壤條件", "value": "土層深厚、土質疏鬆肥沃及排水良好的砂質壤土；喜氣候濕潤、陽光充足、雨量充足", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37486", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 417, "crop_id": "jianghuang", "field": "繁殖與種植", "value": "以根莖繁殖，選直徑約2.5～3公分、無病蟲害完整的根莖作種苗；行株距90×30公分，覆土深度10～15公分", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37486", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 418, "crop_id": "jianghuang", "field": "施肥", "value": "有機質肥料每公頃6,000～8,000公斤，種植前2週施用於田間", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37486", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 419, "crop_id": "jianghuang", "field": "採收", "value": "種植後約8～10個月可收穫，收穫期12月至翌年2月；植株莖葉逐漸枯萎、塊根充實時即可採收", "source_name": "農業知識入口網（藥用植物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=37486", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 420, "crop_id": "lanmei", "field": "土壤與環境", "value": "喜全日照，土壤及介質需有機質含量高、疏鬆、適量酸度，pH值需低於5.2", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=420759", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 421, "crop_id": "lanmei", "field": "授粉", "value": "花期需授粉昆蟲，兔眼藍莓需混植2品種以上有利結實", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=420759", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 422, "crop_id": "lanmei", "field": "花芽分化", "value": "夏季培養健壯枝條有利秋冬季花芽分化", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=420759", /knowledge_view.php?id=8363", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 27, "crop_id": "tongao", "name": "蚜蟲／夜盜蟲／切根蟲", "type": "蟲害", "symptom": "茼蒿常見蟲害", "control": "噴施馬拉松乳劑防治", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8363", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 28, "crop_id": "jielan", "name": "黑腐病", "type": "病害", "symptom": "細菌性病害，高溫高濕環境易發生", "control": "定期檢查葉片與莖部及早發現；使用天然農藥或肥皂水噴霧防治", "source_name": "農業知識入口網（使用者問答）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=18199", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 29, "crop_id": "jielan", "name": "菜青蟲／小菜蛾／蚜蟲", "type": "蟲害", "symptom": "芥藍常見蟲害", "control": "定期檢查葉片與莖部及早發現；使用天然農藥或肥皂水噴霧防治", "source_name": "農業知識入口網（使用者問答）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=18199", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 30, "crop_id": "nangua", "name": "果實蠅", "type": "蟲害", "symptom": "南瓜開花後果實易被果實蠅叮咬產卵，太晚套袋防治無效", "control": "開花後馬上套透氣紙袋，需及時處理，太晚套袋沒有用", "source_name": "農業知識入口網（使用者問答）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=6113", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 31, "crop_id": "nangua", "name": "潛葉蟲", "type": "蟲害", "symptom": "以植物葉子組織為食的昆蟲幼體", "control": "取柑橘皮浸泡後噴灑葉面防治", "source_name": "農業知識入口網（使用者問答）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3091", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 32, "crop_id": "kugua", "name": "白粉病", "type": "病害", "symptom": "產生白色粉末狀物（病原菌菌絲與分生胞子），漸變灰色，可感染葉片、葉柄、嫩蔓；嚴重時葉片變黃枯落，甚至全株表面覆滿白色粉狀物", "control": "發病初期拔除罹病葉與枝條；噴佈葵花油＋無患子油(9:1)300倍液；未罹病前噴佈枯草桿菌製劑", "source_name": "農業知識入口網（苦瓜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=38103", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 33, "crop_id": "kugua", "name": "病毒病", "type": "病害", "symptom": "葉片呈現綠色與淡綠色鑲崁的顏色，生長勢減弱，果實生長與外觀易受影響、產量下降；由粉蝨、蚜蟲、薊馬等傳播", "control": "防治傳播媒介害蟲（粉蝨、蚜蟲、薊馬）"
