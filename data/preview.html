": "2026-08-19"}, {"id": 40, "crop_id": "yutou", "name": "長角象鼻蟲", "type": "蟲害", "symptom": "幼蟲蛀食成隧道狀，傷口易為軟腐病原菌侵入", "control": "後期保持土壤濕潤", "source_name": "農業知識入口網（芋頭主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=18996", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 41, "crop_id": "yutou", "name": "福壽螺", "type": "蟲害", "symptom": "危害芋苗，為水芋栽培常見問題", "control": "80%聚乙醛可濕性粉劑每公頃1.2公斤，或苦茶粕每分地10～15公斤", "source_name": "農業知識入口網（芋頭主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=18996", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 42, "crop_id": "jiang", "name": "薑青枯病", "type": "病害", "symptom": "細菌性病害，切開莖部維管束有褐變現象，莖部剖面置於清水中可見乳白色雲霧狀菌泥自切面流出", "control": "參考植物保護手冊防治方法，選用健康種薑、避免連作", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=7287", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 43, "crop_id": "jiang", "name": "薑軟腐病", "type": "病害", "symptom": "真菌性病害，清水中無乳白色物流出，危害處表面可見白色菌絲", "control": "參考植物保護手冊防治方法，選用健康種薑、避免連作", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=7287", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 44, "crop_id": "jiucai", "name": "薊馬", "type": "蟲害", "symptom": "以口器挫吸葉片留下白色條斑狀食痕，形成細密長形灰白色斑點，嚴重時葉枯黃", "control": "辣椒水稀釋噴施；搭配黃色黏蟲紙；使用天敵（小黑花椿象）；或選購殺薊馬殺蟲劑噴施", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=5684", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 45, "crop_id": "jiucai", "name": "白絹病", "type": "病害", "symptom": "初發病於株莖基部呈水浸狀病斑，罹病株倒伏、葉片枯萎，長出白色棉狀菌絲體", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=5684", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 46, "crop_id": "cong", "name": "紫斑病", "type": "病害", "symptom": "被害葉初呈淡褐色小型病斑，擴大成紡錘狀後凹陷為暗紫色紡錘型病斑，邊緣淡紅色至淡紫色，病斑上產生黑色黴狀物同心輪，常因帶狀乾枯而折斷；發病適溫25℃，需雨水或持續露水期侵入，亦可危害大蒜及洋蔥", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=7320", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 47, "crop_id": "xigua", "name": "銀葉粉蝨", "type": "蟲害", "symptom": "成蟲及若蟲群集葉背吸食，嚴重時葉片黃化，分泌蜜露誘發煤煙病，並傳播瓜類退綠黃化病毒與南瓜捲葉菲律賓病毒", "control": "注意田間衛生、減少中間寄主或雜草；植株頂端30公分內懸掛黃色黏板誘殺；每葉葉背超過2隻成蟲需加強防治；適當疏蔓疏葉、氮肥不宜過多；藥劑輪用並噴到葉背", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=404457", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 48, "crop_id": "mangguo", "name": "炭疽病", "type": "病害", "symptom": "危害果實、花穗、嫩葉及嫩梢；葉片初期紅色小斑點逐漸擴大呈褐色致葉片扭曲皺縮；花梗變黑褐色小花脫落；幼果出現紅色小斑點後擴大呈不規則黑點，後熟時形成黑色凹陷不規則病斑", "control": "果園勿雜植高大土芒果；剪除嚴重罹病枝葉並清除落葉落果；修剪枝梢後施用10-10式波爾多液1～2次；4-5月人工疏果或生理落果結束後即行套袋；新梢及開花期加強藥劑防治，降雨後補強施藥", "source_name": "農業知識入口網（芒果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=57003", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 49, "crop_id": "huasheng", "name": "銹病", "type": "病害", "symptom": "由Puccinia arachidis引起，主要危害葉片及葉柄，病斑葉背最多；初期葉表出現黃色小斑，葉背形成夏孢子堆（初黃橙色後轉深褐色），釋出鏽色粉末隨風傳播；嚴重時葉片黃化萎凋、落葉，莢果不飽滿，秋作受害最嚴重", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（落花生主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=27936", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 50, "crop_id": "huasheng", "name": "白絹病", "type": "病害", "symptom": "常發生於晚春作及早秋作生育期，高溫多濕時加重；造成種子腐爛、出土後幼苗死亡，地下莢果及果柄褐化腐爛，患部長出白色絹狀菌絲，土表出現放射狀菌絲束，後期形成白色菌核並轉褐色，嚴重時損失可達80%以上", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（落花生主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=27938", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 51, "crop_id": "baixiangguo", "name": "果實蠅", "type": "蟲害", "symptom": "俗稱蜂仔，成蟲白晝活動，清晨後取食產卵，中午於樹間陰涼處棲息，下午3-4點後再活動，繁殖力強，短期內族群迅速增長，造成落果及腐爛失去商品價值", "control": "含毒甲基丁香油誘殺劑滅雄，須全年全面實施才有效；結果期噴施33%福木松乳劑或50%芬殺松乳劑1000倍，每7～10天施藥一次，採收前12天停止使用；利用寄生蜂等天敵防治幼蟲及蛹", "source_name": "農業知識入口網（百香果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=40183", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 52, "crop_id": "longyan", "name": "龍眼木蝨", "type": "蟲害", "symptom": "一年約發生7個世代，成蟲於嫩梢嫩葉或葉背吸食汁液，造成嫩梢乾枯，葉背棲息處凹陷、葉面對應處突起，嚴重時葉片捲曲變形枯黃落葉，影響樹勢及果實產量品質", "control": "採後修剪維持樹冠透光通風，修剪枝條集中帶離果園減少越冬蟲源；加強水分肥料管理增強樹勢避免抽梢不一致；保護天敵（寄生蜂、草蛉、盲椿）加強生物防治", "source_name": "農業知識入口網（龍眼主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=44975", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 53, "crop_id": "laoli", "name": "炭疽病", "type": "病害", "symptom": "新梢嫩葉尚未轉綠前極易感染，初期紅色小針點逐漸擴大為近圓形褐色斑外圍有黃暈；幼果受侵染留下黑色小斑點，具潛伏感染特性，直到果實成熟病斑才擴大；高溼度、陰雨連綿或颱風季節好發，傷口增加侵入機會", "control": "參考芒果炭疽病防治，清園並提早套袋，清理地面落葉，噴藥降低病原菌密度；尚無專門推薦藥劑，可參考植物保護手冊用於鳳梨、木瓜及香蕉之藥劑", "source_name": "農業知識入口網（酪梨主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=25574", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 54, "crop_id": "fanqie", "name": "晚疫病", "type": "病害", "symptom": "由致病疫霉(Phytophthora infestans)引起，性喜冷涼潮濕氣候，可危害葉、葉柄、莖、花序及果實，初呈水浸狀圓形或不規則病斑，濕度大或降雨時病斑迅速擴大成灰褐色壞疽斑，周邊長出白色黴狀物；發病適溫約20℃、相對濕度95%以上；花蓮宜蘭地區冬春季東北季風期間低溫多濕好發", "control": "塑膠布設施栽培加強田間衛生管理；噴施可誘導抗病的中性亞磷酸溶液；藥劑防治", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=19977", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 55, "crop_id": "fanqie", "name": "早疫病", "type": "病害", "symptom": "主要危害葉片，初呈水漬狀綠色病斑，持續惡化出現同心輪紋，嚴重時葉片枯死；好發於高溫多濕季節，溫度25～30℃、空氣濕度高時易發生", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=3778", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 56, "crop_id": "hugua", "name": "露菌病", "type": "病害", "symptom": "由Pseudoperonospora cubensis引起，影響瓜類作物包含胡瓜", "control": "參考植物保護手冊防治方法，設施栽培屋頂覆蓋透明塑膠布可阻擋雨水傳播", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8696", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 57, "crop_id": "hugua", "name": "炭疽病", "type": "病害", "symptom": "由Colletotrichum gloeosporioides引起，主要危害葉片，初期近葉脈處出現褐黃色圓形病斑", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8696", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 58, "crop_id": "lajiao", "name": "炭疽病", "type": "病害", "symptom": "好發於高溫多雨季節，最適發病溫度25～28℃，分生孢子藉雨水飛濺或灌溉水傳播；病原菌於開花期或幼果期感染，至果實成熟後才顯現病徵，嚴重時可造成50%以上產量損失", "control": "有機防治可用亞磷酸1,000倍混合枯草桿菌500倍及苦楝油500倍，每3天一次連續三次，建議5～10月每月防治一次", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=18552", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 59, "crop_id": "lajiao", "name": "病毒病", "type": "病害", "symptom": "有多種花葉病及壞死病，為辣椒栽培中危害較重的病害之一", "control": "防治傳播媒介昆蟲（蚜蟲、薊馬等）", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=18552", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 60, "crop_id": "qiukui", "name": "二點小綠葉蟬", "type": "蟲害", "symptom": "成蟲及若蟲棲息葉背，刺吸葉液造成葉片捲曲萎縮及焦枯，葉片由邊緣呈淡黃色逐漸枯萎，造成植株衰弱", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=10018", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 61, "crop_id": "qiukui", "name": "薊馬", "type": "蟲害", "symptom": "以口器吸食葉片、花果，受害初期呈銀白色小斑點，情況惡化後轉為褐色傷口", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=10018", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 62, "crop_id": "yangxiangua", "name": "白粉病", "type": "病害", "symptom": "設施栽培最常見病害，葉片、葉柄、新蔓上出現白色粉狀物，後期轉灰色並產生黑色顆粒狀子囊殼", "control": "物理防治如噴水；礦物油400～500倍稀釋；化學藥劑防治需輪用避免抗藥性", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=7311", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 63, "crop_id": "yangxiangua", "name": "蔓枯病", "type": "病害", "symptom": "主要發生於莖基部，初呈水浸狀病斑，後組織壞死變黑並產生膠質裂痕，為洋香瓜主要病害之一，嚴重時損失慘重", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=7311", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 64, "crop_id": "shanyao", "name": "炭疽病", "type": "病害", "symptom": "由Gloeosporium sp.及Colletotrichum sp.引起；北台灣山藥栽培區主要病害還包含灰黴病、葉斑病、萎凋病、白絹病、晚疫病、病毒病及線蟲", "control": "參考山藥病害防治主題館防治方法", "source_name": "農業知識入口網（山藥主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=33786", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 65, "crop_id": "lusun", "name": "莖枯病", "type": "病害", "symptom": "沿莖生出紡錘形或線狀暗褐色病斑，周緣水浸狀，病斑可達0.2～0.5×2～3公分，病斑圍繞莖枝使上部乾枯而死呈火燒狀；高濕由雨水霧露使孢子釋放傳播感染健康組織", "control": "清除田間病株殘留物及雜草；藥劑防治（免賴得、保利黴素、腐絕、鋅錳乃浦等）", "source_name": "農業知識入口網（蘆筍主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=30071", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 66, "crop_id": "lusun", "name": "莖腐病", "type": "病害", "symptom": "主要危害幼筍，莖表出現水浸狀斑駁進而腐爛崩潰", "control": "加強田間排水；清除病株", "source_name": "農業知識入口網（蘆筍主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=30071", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 67, "crop_id": "lusun", "name": "立枯病", "type": "病害", "symptom": "植株黃化、矮化、萎凋而枯死，根部維管束褐化", "control": "選用抗病品種；改善排水；廢耕轉作3～5年以上", "source_name": "農業知識入口網（蘆筍主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=30071", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 68, "crop_id": "kafei", "name": "咖啡銹病", "type": "病害", "symptom": "初期上葉表淡黃色小斑點，下葉表有橘黃色夏胞子堆自氣孔長出，後期佈滿病斑中心漸乾枯成褐色，通常下位葉先發病再向上蔓延；減少光合量導致減產15～20%，嚴重達70%，造成提早落葉或全株枯死；夏胞子需連續24～48小時游離水才能發芽感染，多在雨季感染，發病溫度15～28℃", "control": "選擇日照良好栽培地；適當調整氮磷肥、減少鉀肥；寬行栽植與適當修剪增加通風；控制每棵樹結果節在230節以下；控制雜草並嚴格清園；國外用銅劑可防治但國內尚未有推薦農藥", "source_name": "農業知識入口網（咖啡主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=45565", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 69, "crop_id": "kafei", "name": "咖啡果小蠹", "type": "蟲害", "symptom": "學名Hypothenemus hampei，雌蟲以咀嚼式口器於咖啡果實臍部鑽食小圓孔，蛀食果實內部胚，造成果實無法成熟或成熟果實滿佈蛀孔，生豆含水量高於12%時儲存期間會繼續蛀食", "control": "使用誘殺器監測發生密度或大量誘殺（台南區農業改良場與茶葉改良場已開發）；清除園區內被害果", "source_name": "農業知識入口網（咖啡主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=45584", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 70, "crop_id": "niupang", "name": "切根蟲／甜菜夜蛾／斜紋夜盜", "type": "蟲害", "symptom": "牛蒡主要蟲害種類，另有番茄斑潛蠅及光褐菊蚜", "control": "性費洛蒙誘殺（每公頃設5～10個點長期誘殺）；化學藥劑防治以傍晚噴藥效果最佳", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=115", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 71, "crop_id": "hongdou", "name": "豆類花薊馬", "type": "蟲害", "symptom": "對紅豆威脅最大的蟲害，必須於開花期特別注意防範", "control": "參考安全用藥紅豆病蟲害防治用藥表、植物保護手冊豆類部分或紅豆TGAP病蟲草害防治曆", "source_name": "農業知識入口網（紅豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39711", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 72, "crop_id": "hongdou", "name": "白粉病", "type": "病害", "symptom": "紅豆較常見病害之一", "control": "參考安全用藥紅豆病蟲害防治用藥表", "source_name": "農業知識入口網（紅豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39711", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 73, "crop_id": "hongdou", "name": "根腐病", "type": "病害", "symptom": "低濕地區易發生", "control": "參考植物保護手冊豆類部分", "source_name": "農業知識入口網（紅豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39711", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 74, "crop_id": "yumi", "name": "玉米銹病", "type": "病害", "symptom": "普通型銹病病斑多見於葉片、葉鞘及苞葉，初期表皮覆蓋數天後破裂產生咖啡色粉末狀孢子，後期形成深褐至黑色孢子堆；南方型銹病病斑密集小圓形(直徑0.2～0.5公厘)、金黃色，多發生於生長中後期", "control": "栽培抗病品種；11.8%護汰芬水懸劑稀釋2000倍，發病初期開始每10天施藥一次共4次；或45.5%待普利乳劑稀釋5000倍，發病時施藥後每7～10天再施連續3次", "source_name": "農業知識入口網（玉米主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=31684", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 75, "crop_id": "yumi", "name": "玉米螟", "type": "蟲害", "symptom": "學名Ostrinia furnacalis，北部一年3～4代、南部7～8代，南部因周年栽培整年可找到寄主", "control": "發芽後20～25天開始釋放蜂片，每隔6～7天釋放一次連續4次（每次每公頃150片）；拔除全園1/2～3/5雄花斷絕初齡幼蟲食物；藥劑可選蘇力菌製劑、諾伐隆乳劑、加保利等", "source_name": "農業知識入口網（玉米主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=31697", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 76, "crop_id": "azhai", "name": "萵苣蚜蟲", "type": "蟲害", "symptom": "葉片顏色變淡或呈灰綠色且變形，受害萵苣不具賣相；嚴重時植株停止生長；會傳播葉脈帶狀病毒、花椰菜花葉病毒及小黃瓜花葉病毒；侵入結球萵苣內部後施藥不易滅除，且易對藥劑產生抗性", "control": "定期且有效的藥劑防治可將損失控制在10%以下；抗性育種；施放草蛉及捕食性昆蟲進行生物防治", "source_name": "農業知識入口網（萵苣主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=8651", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 77, "crop_id": "huanggongcai", "name": "斑點病", "type": "病害", "symptom": "生長勢強健、少有病蟲害，僅老化葉片會發生斑點病，雨天葉子容易受損產生斑點", "control": "落葵抵抗力強，栽培期間可完全不使用農藥", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=13106", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 78, "crop_id": "longxucai", "name": "蔓枯病", "type": "病害", "symptom": "龍鬚菜生命力強健、種植時較少病蟲害，但採用畦作栽培時比棚架栽培容易感染蔓枯病", "control": "採棚架栽培較能降低感染風險", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8735", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 79, "crop_id": "bocai", "name": "立枯病", "type": "病害", "symptom": "病原菌為Rhizoctonia solani、Pythium sp.及Fusarium sp.；菠菜蟲害冬天較少，病害則因雨水較嚴重", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=city_farming&id=98", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 80, "crop_id": "jiecai", "name": "黃葉病", "type": "病害", "symptom": "十字花科蔬菜重要病害，植株生長任何階段皆可能發生，近基部根維管束變色並逐漸腐敗，導致植株生長不良不適合醃漬", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1497", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 81, "crop_id": "jiecai", "name": "番茄斑潛蠅／小菜蛾", "type": "蟲害", "symptom": "與黃葉病並列為芥菜最重要的病蟲害，嚴重時可能導致棄耕", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=1497", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 82, "crop_id": "jiucengta", "name": "露菌病", "type": "病害", "symptom": "由Peronospora belbahrii引起，冷涼高濕環境易感染，感染初期葉片黃化及輕微皺縮扭曲，隨後背面產生黑褐色絨毛狀物", "control": "移除病葉；避免傍晚澆水", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9403", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 83, "crop_id": "jiucengta", "name": "蚜蟲", "type": "蟲害", "symptom": "聚集嫩葉處吸食汁液，導致葉子捲曲變形；另有軍配蟲、薊馬、葉蟎等造成葉片白斑", "control": "葵無露或苦楝油於清晨或傍晚氣溫較涼時噴施；蚜蟲天敵以瓢蟲最常見，可利用生物防治", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=13602", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 84, "crop_id": "shansu", "name": "介殼蟲與軟體動物", "type": "蟲害", "symptom": "自然環境下山蘇少有重大病蟲害，但近年林下、檳榔園下大量種植且多不施農藥，一旦發生易滋生蔓延；介殼蟲、蝸牛、蛞蝓等軟體動物為害最普遍，蝸牛蛞蝓對產量影響最大", "control": "另有豆芫菁、螟蛾類、根蟎、螽斯及蝗蟲類等蟲害，及真菌細菌線蟲類病害", "source_name": "農業知識入口網（山蘇主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=22725", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 85, "crop_id": "digua", "name": "甘藷蟻象", "type": "蟲害", "symptom": "危害塊根，為甘藷最常見害蟲", "control": "每公頃施用2.5%陶斯松粉劑45公斤於莖蔓間，間隔7～10天施用一次，連續3～4次；另可設置性費洛蒙誘蟲盒", "source_name": "農業知識入口網（甘藷主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=19321", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 86, "crop_id": "digua", "name": "甘藷蔓割病", "type": "病害", "symptom": "生育期病害之一（與縮芽病、簇葉病、病毒病並列），採收後貯藏期另有軟腐病及炭化病", "control": "輪作；浸水處理；藷苗浸藥處理", "source_name": "農業知識入口網（甘藷主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=19321", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 87, "crop_id": "wandou", "name": "豌豆立枯病", "type": "病害", "symptom": "台灣夏秋季豌豆栽培的主要限制因子，屬重要的土壤傳染性病害", "control": "參考植物保護手冊防治方法，避免夏秋季連作", "source_name": "農業知識入口網（豌豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/index.php?id=145", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 88, "crop_id": "wandou", "name": "薊馬類", "type": "蟲害", "symptom": "豌豆栽培最重要的限制因子，栽培密度高或過早栽培（乾燥高溫）環境易使薊馬高密度發生；另有甜菜夜蛾、斑潛蠅危害", "control": "參考植物保護手冊防治方法，避免過早栽培於乾燥高溫環境", "source_name": "農業知識入口網（豌豆主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/index.php?id=145", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 89, "crop_id": "youcai", "name": "軟腐病", "type": "病害", "symptom": "組織最初出現水浸狀小斑點，快速加深加寬，病組織軟化變色起皺並裂開流出黏稠液體，產生硫磺臭味", "control": "避免密植維持通風與排水，拔除銷毀病株；施用12.5%鏈黴素溶液1000倍；施用殺蟲劑防治媒介昆蟲；採收避免傷口並低溫低濕保存", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2630", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 90, "crop_id": "dasuan", "name": "赤銹病／病毒病／黃萎病", "type": "病害", "symptom": "大蒜主要病害，赤銹病(銹病)危害葉片，病毒病與黃萎病亦為常見問題", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（大蒜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/index.php?id=56289", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 91, "crop_id": "lianou", "name": "福壽螺", "type": "蟲害", "symptom": "1979年自阿根廷引進台灣後棄養擴散，危害水芋、蓮花、空心菜等水生作物；4～11月高溫多雨季節活躍，食量大繁殖快，積水時危害最嚴重，啃食葉柄葉片及外露塊莖", "control": "參考植物保護手冊防治方法，注意田間積水管理", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=31960", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 92, "crop_id": "jianghuang", "name": "炭疽病", "type": "病害", "symptom": "危害莖、葉", "control": "發病初期噴50%多菌靈可濕性粉劑500倍液，每旬噴1次", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=10505", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 93, "crop_id": "xiangcai", "name": "蚜蟲／白粉虱／葉蟎", "type": "蟲害", "symptom": "常見害蟲，吸食植物汁液，導致葉片枯黃或變形；葉片柔嫩容易因雨水造成傷害", "control": "肥皂水噴灑物理清除；保持良好通風與適當灌溉減少滋生；嚴重時可用瓢蟲等生物防治", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=4516", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 94, "crop_id": "ganzhe", "name": "螟蟲（鑽心蟲）", "type": "蟲害", "symptom": "為害普遍而嚴重，幼蟲鑽入甘蔗幼苗和蔗莖，苗期入侵生長點造成枯心苗，生長中後期入侵蔗莖形成蟲孔節破壞組織使糖分降低；主要有黃螟、條螟、二點螟、大螟、白螟等5種", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2377", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 95, "crop_id": "huma", "name": "芝麻莢野螟", "type": "蟲害", "symptom": "學名Antigastra catalaunalis，胡麻主要害蟲之一", "control": "參考胡麻主題館病蟲害防治藥劑資訊", "source_name": "農業知識入口網（胡麻主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/index.php?id=163", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 96, "crop_id": "huma", "name": "菸盲椿象", "type": "蟲害", "symptom": "學名Nesidocoris tenuis，胡麻常見害蟲之一", "control": "參考胡麻主題館病蟲害防治藥劑資訊", "source_name": "農業知識入口網（胡麻主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/index.php?id=163", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 97, "crop_id": "xiaomi", "name": "葉銹病", "type": "病害", "symptom": "真菌性病害，葉片正反兩面及葉鞘、稈出現大量褐色夏孢子，病菌以冬孢子在病株殘體上越冬，藉雨水昆蟲風媒傳播；多雨、高溫高濕及氮肥過多時易發病", "control": "種植抗病品種；合理施肥", "source_name": "農業知識入口網（小米及台灣藜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=32244", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 98, "crop_id": "xiaomi", "name": "粟灰螟", "type": "蟲害", "symptom": "幼蟲於苗基部葉鞘蛀入莖內，5天後苗心葉枯萎，蛀莖4天後開始從洞孔排出蟲糞殘屑，一隻幼蟲可轉移危害3～4株幼苗", "control": "釋放赤眼卵寄生蜂等天敵；使用蘇力菌微生物製劑", "source_name": "農業知識入口網（小米及台灣藜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=32237", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 99, "crop_id": "xiaomi", "name": "粟夜盜蟲", "type": "蟲害", "symptom": "咬斷穗部、啃食葉莖，5～6齡為暴食階段危害最嚴重", "control": "中耕除草撿拾卵塊；廢園翻犁及灌水；燈光或性費洛蒙誘殺；釋放寄生蜂或使用蘇力菌、核多角體病毒", "source_name": "農業知識入口網（小米及台灣藜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=32237", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 100, "crop_id": "lizhi", "name": "荔枝椿象", "type": "蟲害", "symptom": "學名Tessaratoma papillosa，俗稱臭屁蟲，以刺吸方式危害荔枝、龍眼，導致落花落果、嫩枝幼果枯萎，並引起荔枝酸腐病；為害常造成20～30%損失，嚴重達80～90%產量損失；成蟲若蟲亦傳播龍眼鬼帚病", "control": "台灣本島目前為非疫區（僅金門曾發現危害）；荔枝及龍眼盛花期應停止施藥以免傷害授粉昆蟲，其餘時期可參考植物保護手冊防治", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=2898", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 101, "crop_id": "lianwu", "name": "東方果實蠅", "type": "蟲害", "symptom": "台灣果樹最重要害蟲，寄主包含蓮霧、芭樂、柑橘、芒果、楊桃、梨、桃、釋迦、棗、龍眼、荔枝、柿等；雌蟲產卵於果實，幼蟲蛀食造成表面出油、果實腐爛甚至提早落果，使果實失去商品價值", "control": "清園移除落果；套袋阻絕；懸掛含毒甲基丁香油誘殺器誘殺雄蟲", "source_name": "農業知識入口網（蓮霧主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=2319", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 102, "crop_id": "mugua", "name": "輪點病毒病", "type": "病害", "symptom": "俗稱「狂株」，1975年首見於高雄燕巢，由有翅蚜蟲及機械傳播、迅速蔓延；心葉黃化縮小，葉背水浸狀輪狀或點狀病斑，病葉變小葉緣乾枯脫落，僅剩頂端新葉甚至全脫落致死；花瓣果實出現油浸狀斑紋輪紋，開花不能結果或果實品質差", "control": "網室栽培；栽植耐病品種台農五號；苗接種弱毒交互保護；套袋並間作玉米；避免園內及附近栽植西瓜南瓜胡瓜甜瓜等中間寄主瓜類；接觸病株的手與工具用肥皂水洗滌；儘早拔除病株深埋或燒毀", "source_name": "農業知識入口網（木瓜主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=8200", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 103, "crop_id": "fengli", "name": "心腐病", "type": "病害", "symptom": "由Phytophthora spp.引起，雨季高溫時嚴重，主要危害新植苗或幼株，造成萎凋葉片轉紅下垂甚至倒伏，縱切病株心葉組織呈褐色腐爛並有白色菌絲及霉味，病健交界處有深褐色暈環", "control": "參考植物保護手冊防治方法，注意排水避免積水", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?func=1&type=432&id=7028", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 104, "crop_id": "putao", "name": "露菌病", "type": "病害", "symptom": "由Plasmopara viticola引起，葉下表皮產生白色黴狀物胞囊、葉上表皮產生維管束侷限型病斑，亦感染枝條捲鬚花及幼果，幼果感染後萎縮並產生胞囊傳播鄰近果實；好發16～28℃，胞囊藉風雨傳播，相對濕度85%以下無法順利產生胞囊，高濕多雨環境利於發展", "control": "參考植物保護手冊防治方法，注意田間通風排水", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=393397", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 105, "crop_id": "putao", "name": "黑痘病", "type": "病害", "symptom": "好發於梅雨期及夏季，隨雨露水傳染，危害新梢、葉片、花穗", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledgebase.php?id=393397", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 106, "crop_id": "caomei", "name": "炭疽病", "type": "病害", "symptom": "近年躍升草莓育苗期頭號殺手，好發高溫多濕環境，病原菌包含Colletotrichum gloeosporioides、C. fragariae、C. acutatum等", "control": "參考植物保護手冊防治方法，育苗期加強通風降低濕度", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=agri_book&id=2140", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 107, "crop_id": "tianshi", "name": "炭疽病", "type": "病害", "symptom": "病原菌Colletotrichum gloeosporioides，感染幼嫩葉片、枝條及果實；嫩枝染病初期出現黑色斑點，後擴展為2公分長紡錘型病斑，皮層凹陷龜裂嚴重時枝枯；果實轉色期出現圓形至橢圓形深褐色病斑；全年可發生，3～4月高濕環境發病轉劇烈", "control": "整枝修剪去除病枝減少感染源；果樹萌芽時噴施25%撲克拉乳劑2000倍，之後每隔2星期施藥一次，採收前9天停止施藥", "source_name": "農業知識入口網（甜柿主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=7694", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 108, "crop_id": "shijia", "name": "東方果實蠅", "type": "蟲害", "symptom": "年約發生8～9世代，7～9月發生密度較高，雌蟲選擇黃熟果實產卵，幼蟲於果肉內蛀食致使果實腐爛及落果", "control": "清園撿除落果；套袋阻絕法；懸掛含毒甲基丁香油誘燈誘殺雄蠅", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=6342", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 109, "crop_id": "ganju", "name": "介殼蟲類", "type": "蟲害", "symptom": "黑點介殼蟲死後緊密貼附於枝葉或果實上不易脫落；褐圓介殼蟲使枝葉萎縮變黃而凋落", "control": "44%大滅松乳劑稀釋1000倍噴施", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2823", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 110, "crop_id": "ganju", "name": "蚜蟲類", "type": "蟲害", "symptom": "成蟲及若蟲群集新梢嫩葉吸食汁液，被害新葉捲縮", "control": "44%大滅松乳劑稀釋1000倍噴施", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2823", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 111, "crop_id": "ganju", "name": "柑橘木蝨", "type": "蟲害", "symptom": "成蟲及若蟲群集新梢嫩葉吸食汁液，被害嫩梢枝條常呈畸形", "control": "44%大滅松乳劑稀釋1000倍噴施", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2823", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 112, "crop_id": "ganju", "name": "潛葉蛾", "type": "蟲害", "symptom": "幼蟲孵化後蛀入嫩葉葉肉危害，形成中空曲折隧道，新葉捲縮不展", "control": "24%納乃得可濕性粉劑稀釋750倍", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2823", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 113, "crop_id": "ganju", "name": "星天牛", "type": "蟲害", "symptom": "幼蟲先繞皮層內側盤食後蛀食木質部，被害株葉片黃化凋落", "control": "成蟲出現時每隔一個月將40.64%加保扶水懸劑100倍藥液噴灑於離地面45公分之樹幹基部", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2823", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 114, "crop_id": "xiangjiao", "name": "香蕉黃葉病", "type": "病害", "symptom": "病原菌Fusarium oxysporum f.sp cubense (FOC)，俗稱Panama disease；下方老葉葉緣先黃化擴大至中肋，葉柄軟化彎曲下垂後枯萎，上方幼葉逐漸變黃終至整株枯萎死亡；假莖或塊莖縱切可見維管束呈黃色至褐色，後期貫穿成長條形", "control": "參考植物保護手冊防治方法，選用抗病品種、避免病區種苗", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8043", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 115, "crop_id": "xiangjiao", "name": "香蕉葉斑病", "type": "病害", "symptom": "危害全球香蕉產區最嚴重病害之一，初期第3或4片葉背面出現紅棕色小條斑，後擴大變黑並出現於葉表面，後期轉黑褐色或黑色病斑，受害葉片提早枯死，影響健葉數導致產期延後或減產；目前僅侷限東部台東關山至花蓮壽豐、西部高雄美濃至台南楠西零星發生", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8043", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 116, "crop_id": "yangtao", "name": "褐根病", "type": "病害", "symptom": "楊桃主要病害之一，會導致楊桃樹死亡", "control": "田間衛生管理，定期清除銷毀病葉病枝落果；避免自病區取得嫁接材料或苗木；生理落葉期、修剪後、雨季前預防性施藥；已感染果園需重剪病枝葉後每週噴藥連續5～6次，雨季加強噴藥", "source_name": "農業知識入口網（楊桃主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/index.php?id=26", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 117, "crop_id": "ningmeng", "name": "柑橘潛葉蛾", "type": "蟲害", "symptom": "全年皆有危害，2～7月危害普遍較嚴重；卵產於植物表皮內，孵化幼蟲於表皮內鑽孔挖道取食，葉片上形成不規則圖形", "control": "參考檸檬常見重要蟲害及有害動物防治介紹", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=16623", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 118, "crop_id": "donggua", "name": "灰黴病", "type": "病害", "symptom": "生育期皆可危害花及果實，形成褐色水浸狀病斑及灰褐色黴狀物", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=13935", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 119, "crop_id": "donggua", "name": "黑點病", "type": "病害", "symptom": "危害果實及葉片", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=13935", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 120, "crop_id": "malingshu", "name": "晚疫病", "type": "病害", "symptom": "由Phytophthora infestans引起，藉風雨飛濺或人畜攜帶短時間內長距離傳播；台灣冬季16～22℃、相對濕度90～95%以上維持4～6小時以上易發病；被害部位水浸狀黑褐化，感染部位以上組織枯萎，嚴重時全株如火燒狀焦枯死亡", "control": "健康種薯、抗（耐）病品種與田間衛生病害管理為綜合防治重要環節", "source_name": "農業知識入口網（馬鈴薯主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39768", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 121, "crop_id": "malingshu", "name": "瘡痂病", "type": "病害", "symptom": "由植物病原細菌放射線菌Streptomyces scabies引起，存活於土壤和罹病薯塊中，主要由皮目侵入亦可經傷口侵入；薯球表面出現近圓形或不定形木栓化瘡痂狀褐色病斑或疣狀斑塊，嚴重時病斑癒合呈網狀龜裂，影響外觀品質與貯藏性能；薯球膨大後期水分管理不當容易感染", "control": "注意薯球膨大期水分管理", "source_name": "農業知識入口網（馬鈴薯主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39771", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 122, "crop_id": "dabaicai", "name": "軟腐病", "type": "病害", "symptom": "病斑初呈水浸狀小點，迅速擴大，組織軟化變色起皺腐爛裂開流出汁液，導致結球腐爛；常與病毒病、霜霉病並稱大白菜三大病害", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（使用者問答）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=5164", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 123, "crop_id": "dabaicai", "name": "根蛆", "type": "蟲害", "symptom": "大白菜種蠅幼蟲，咬傷菜根後病菌乘機侵入，引起掉幫腐爛", "control": "根際施用草木灰；長至6～8葉時用草木灰、石灰和2.5%敵百蟲粉混合撒施於菜根四週", "source_name": "農業知識入口網（使用者問答）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=5164", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 124, "crop_id": "jiaobaisun", "name": "黑穗菌（形成茭白筍的共生真菌）", "type": "病害", "symptom": "茭白筍食用部位即因黑穗菌寄生刺激莖部細胞增殖膨大而形成的「病態莖」，18～25℃適溫下菌絲生長並產生細胞生長素刺激膨大；若採收過晚孢子成熟，筍肉內出現大量黑色斑點（俗稱「灰茭」），影響賣相與食慾", "control": "須在莖部膨大但孢子尚未成熟前適時採收，避免延遲採收形成灰茭", "source_name": "農業知識入口網（茭白筍主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=31915", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 125, "crop_id": "sijidou", "name": "銹病", "type": "病害", "symptom": "台灣長期多雨潮濕氣候提供理想發病條件，適溫18～26℃，春秋兩季特別嚴重；主要危害葉片偶見豆莢與莖，初期葉背出現白色小斑點，逐漸擴大為銹色隆起圓形斑，導致葉片黃化提早脫落，影響光合作用降低產量品質", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=8529", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 126, "crop_id": "lvhuaqielan", "name": "紋白蝶／小菜蛾", "type": "蟲害", "symptom": "十字花科蔬菜常見鱗翅目害蟲，紋白蝶幼蟲喜食十字花科葉片；小菜蛾幼蟲受驚後有吐絲下垂習性，俗稱「吊絲蟲」", "control": "田間附近種植馬利筋或金露花吸引瓢蟲草蛉椿象等天敵；螟蛾類為害可種單瓣扶桑花利於蜘蛛寄生蜂棲息", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=6934", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 127, "crop_id": "huolongguo", "name": "莖潰瘍病", "type": "病害", "symptom": "病原菌Neoscytalidium dimidiatum，果實初現白色凹陷圓斑(1.0-1.5mm)逐漸擴大，病斑中央出現小紅點，多個病斑癒合成大片褐色塊斑，罹病組織表面出現褐色結痂硬塊容易龜裂，果實褐色軟化逐漸轉黑並產生黑色針狀產孢構造；莖部白色斑點中央紅點擴大突起，病斑周圍木栓化長出黑色小點，高濕時周圍組織黃色潰爛；為高溫菌30℃危害較嚴重，好發5～9月雨季", "control": "選用健康無病害枝條種植於新植地；11月至翌年3月乾冷季節清園並用4-4式波爾多液保護新生枝條（此時病原菌最虛弱防治最有效率）；藥劑可用得克利、甲基多保淨、賽普護汰寧等；合理化施肥減少氮肥、提前套袋", "source_name": "農業知識入口網（紅龍果主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=39779", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 128, "crop_id": "lingjiao", "name": "福壽螺", "type": "蟲害", "symptom": "1979年自阿根廷引進台灣後棄養，1982年首見危害高屏地區新植稻苗，隨後發現危害菱角、水芋、空心菜、蓮花等水生經濟作物，每年危害逾10萬公頃農地；偏好取食嫩莖部位，水溫低（約15℃）或濕度不足時活動力降低", "control": "田間進水口裝鐵網阻隔螺類進入水溝；排水口放置30公分塑膠浪板防止螺類進入田區；人工摘除卵塊並撿拾螺體；田埂周圍每公頃施用茶粕50公斤；使用苦楝萃取物製成的「移護螺」粒劑每公頃10～15公斤；有機田可養鴨協助清除", "source_name": "農業知識入口網（茭白筍主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=31961", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 129, "crop_id": "pingguo", "name": "銹病", "type": "病害", "symptom": "發生於葉片及枝條，初呈橢圓形隆起病斑，形成夏孢子堆後轉橙黃色並釋出鏽褐色粉末狀夏孢子，台灣好發高峰期為1～6月", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9850", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 130, "crop_id": "pingguo", "name": "蚜蟲", "type": "蟲害", "symptom": "有翅與無翅型，孤雌生殖繁殖快速，群集葉背及枝梢吸食汁液造成黃化萎凋，分泌蜜露誘發煤煙病，並可能傳播病毒病", "control": "肥皂水噴灑葉背（酒精會傷害蘋果樹不建議使用）", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9850", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 131, "crop_id": "jiangdou", "name": "萎凋病", "type": "病害", "symptom": "長豇豆受萎凋病威脅嚴重，「見錢死」使國內種植面積從98年1,353公頃大幅下降；另有白絹病、瓜實蠅及薊馬等常見病蟲危害", "control": "高雄區農業改良場已推出2.0版抗病根砧嫁接苗，抗病力逾96%、增產可達45%", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=169", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 132, "crop_id": "jiangdou", "name": "銹病", "type": "病害", "symptom": "豇豆／四季豆常見病害之一", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/theme_data.php?theme=production_map&id=169", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 133, "crop_id": "huangdidou", "name": "蚜蟲", "type": "蟲害", "symptom": "皇帝豆常見蟲害；果莢較硬能抵抗許多蟲害，栽培相對容易", "control": "有機防治：預防用矽藻土（破壞蟲體表皮蠟質層）、印楝素、苦楝油；治療用葵無露、夏油、礦物油、窄域油（覆蓋蟲體表面使其窒息）；可用黏蟲板監測粉蝨薊馬蚜蟲等數量", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9516", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 134, "crop_id": "hangju", "name": "白絹病", "type": "病害", "symptom": "病原菌Sclerotium rolfsii，主要危害莖基部，破壞維管束組織阻斷水分運輸，導致植株生長勢減弱並逐漸萎凋", "control": "參考機能作物主題館防治方法", "source_name": "農業知識入口網（機能作物主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=40408", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 135, "crop_id": "hangju", "name": "菊蚜等蟲害", "type": "蟲害", "symptom": "杭菊常見病蟲害包括薊馬、夜蛾、毒蛾、粉介殼蟲、葉蟎、介殼蟲及菊蚜等；主要病害另有黑斑病及炭疽病", "control": "非農藥防治：蘇力菌防治夜蛾毒蛾幼蟲；性費洛蒙陷阱誘捕夜盜蟲；印楝油或礦物油防治粉介殼蟲薊馬蚜蟲葉蟎；黃色或藍色黏紙誘捕薊馬粉介殼蟲", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=20004", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 136, "crop_id": "hongcongtou", "name": "紫斑病", "type": "病害", "symptom": "被害葉初呈淡褐色小型病斑，漸擴大成紡錘形，後凹陷為暗紫色紡錘形病斑，邊緣淡紅色至淡紫色，上下兩邊黃化，病斑上產生黑色黴狀物同心輪；此病原菌亦可危害同屬的蔥與大蒜", "control": "參考植物保護手冊防治方法", "source_name": "農業知識入口網", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=7320", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 137, "crop_id": "qingjiangcai", "name": "蚜蟲", "type": "蟲害", "symptom": "青江菜整年栽種除嚴冬外皆需注意蚜蟲侵害，刺吸葉液，被害嚴重時葉片捲縮或萎凋，植株生長不良", "control": "酒精稀釋液100～400倍防治蚜蟲、粉介殼蟲；採收完畢立即整地割除殘株雜草消滅蟲源；黃色黏板誘殺成蟲", "source_name": "農業知識入口網（種植教學整理）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=2374", "source_type": "qa", "fetched_date": "2026-08-19"}, {"id": 138, "crop_id": "guomao", "name": "病蟲害極少", "type": "其他", "symptom": "過貓天然病蟲害極少，是少數不需噴灑農藥即可栽培的蔬菜之一，此特性也是其被視為友善環境作物的主要原因", "control": "無須農藥防治", "source_name": "農業知識入口網（原住民族農產業主題館）", "source_url": "https://kmweb.moa.gov.tw/knowledge_view.php?id=9338", "source_type": "official", "fetched_date": "2026-08-19"}, {"id": 139, "crop_id": "tiancaigen", "name": "甜菜夜蛾", "type": "蟲害", "symptom": "普遍發生於多種蔬菜與花卉之重要害蟲，成蟲晝伏夜出，一年可發生十餘代；初齡幼蟲取食葉背葉肉殘留上表皮，2～3齡後分散蠶食葉片呈不規則缺刻或孔洞，嫩芽花器亦可能受害", "control": "可用陶斯松、第滅寧、汰芬諾克、馬拉松、芬化利、納乃得、畢芬寧、蘇力菌等藥劑防治", "source_name": "農業知識入口網（甘藍主題館）", "source_url": "https://kmweb.moa.gov.tw/subject/subject.php?id=13450", "source_type": "official", "fetched_date": "2026-08-19"}], "notes": [{"id": 1, "crop_id": "xiaobaicai", "note": "病毒病、軟腐病、霜霉病、黑斑病、蚜蟲、白粉虱、煙粉虱、菜青蟲、甜菜夜蛾等在多篇二手資料中被提及，但尚未從官方單一頁面取得防治細節，需另行查證。"}, {"id": 2, "crop_id": "digualve", "note": "適合季節、溫度範圍、土壤類型、株距、施肥方式尚未找到官方明確數據，目前僅有使用者問答等級的種植敘述，需另找改良場或農業部正式頁面補齊。"}, {"id": 3, "crop_id": "digualve", "note": "甘藷病毒病可造成產量90%以上損失，防治方式僅查到「種植去病毒健康種苗」，缺乏地瓜葉專屬（食用葉部而非塊根）的病蟲害資料，需另行查證。"}, {"id": 4, "crop_id": "fanqie", "note": "番茄病害（早疫病、晚疫病、青枯病、黃化捲葉病毒病等）僅查到病害名稱列表，尚未取得症狀與防治方法的官方原文，需點擊各篇原文逐一查證後才能收錄。"}, {"id": 5, "crop_id": "fanqie", "note": "水分管理、施肥劑量、採收天數尚未取得官方明確數據，原文僅提及「參照農業部施肥手冊及植物保護手冊」，需另行查找該手冊內容。"}, {"id": 6, "crop_id": "kongxincai", "note": "溫度範圍、土壤成分、株距尚未取得官方明確數據，原文僅強調耐熱耐濕、全年可栽培，需另找具體數據來源。"}, {"id": 7, "crop_id": "kongxincai", "note": "白鏽病在多篇資料中被列為空心菜常見病害，但本次查證的頁面實際診斷案例為葉蟎（紅蜘蛛），並非白鏽病，兩者症狀易混淆，白鏽病防治細節需另行查證。"}, {"id": 8, "crop_id": "luobo", "note": "本筆栽培資料原文使用「畝」「釐米」等中國大陸慣用單位與前作輪作建議，疑似轉載自中國農業網站內容，套用到台灣種植前，建議換算單位並與台灣農改場資料交叉核對，故全數標記為qa等級。"}, {"id": 9, "crop_id": "luobo", "note": "尚未取得台灣北中南分區栽培差異資料，僅知盛產期為12月至翌年初春，地區差異待補查。"}, {"id": 10, "crop_id": "gaolicai", "note": "施肥方案（用量、肥料種類）與病蟲害防治細節（除黑腐病外，小菜蛾、黃條葉蚤等常見蟲害的具體防治方式）尚未從官方頁面取得，需另行查證。"}, {"id": 11, "crop_id": "dabaicai", "note": "本筆資料多來自使用者問答，施肥數據使用「畝」單位（中國大陸慣用），套用到台灣前需換算並與台灣農改場資料交叉核對；適合季節、溫度、土壤、株距、採收天數等基本欄位仍缺，需找台灣官方栽培曆補齊。"}, {"id": 12, "crop_id": "huaqielan", "note": "土壤pH值、株距等具體栽培數據尚未取得；小菜蛾等蟲害雖在花椰菜主題館中列出，但本次僅查證到黑斑病的完整防治細節，蟲害部分需另行查證。"}, {"id": 13, "crop_id": "xiaohuanggua", "note": "露菌病、疫病、萎凋病、炭疽病、瓜實蠅、銀葉粉蝨等在多篇資料中被列為小黃瓜常見病蟲害，但本次僅查證到白粉病的完整防治細節，其餘需另行查證；株距數據亦尚未取得。"}, {"id": 14, "crop_id": "malingshu", "note": "官方主題館頁面提及晚疫病、瘡痂病、細菌性軟腐病、病毒病為主要病蟲害問題，但本次未查證到具體症狀與防治方法的原文，需另行查證；種薯繁殖與間隔資料僅來自使用者問答，需與官方資料交叉核對。"}, {"id": 15, "crop_id": "huluobo", "note": "黑斑病、黑腐病、根結線蟲病、軟腐病、胡蘿蔔花葉病等在搜尋結果中被列為常見病蟲害名稱，但本次未查證到症狀與防治方法的官方原文，需另行查證；施肥資料亦尚未取得；季節月份為「秋季/春天」的估算值，非原文精確月份。"}, {"id": 16, "crop_id": "qiezi", "note": "茄子主題館列出10種病害、7種蟲害，本次僅收錄最常見的青枯病、白粉病、二點小綠葉蟬、紅蜘蛛類4項，幼苗立枯病、炭疽病、疫病、根瘤線蟲、薊馬、粉蝨、斑潛蠅、多種蛾類等尚未收錄，需視需求後續補齊；適合播種季節亦尚未取得明確資料。"}, {"id": 17, "crop_id": "tianjiao", "note": "斑葉蟎、薊馬、粉蝨等蟲害在搜尋結果中被提及具體藥劑，但本次未透過WebFetch查證原文，暫不收錄，避免引用未直接核實的用藥劑量；分區播種月份（例如夏季高冷地、冬季恆春半島）也需另行查證。"}, {"id": 18, "crop_id": "yangcong", "note": "黃萎病、灰黴病亦是洋蔥常見病害，本次已查得症狀但因與軟腐病、紫斑病相比防治細節較簡略，暫未列入正式資料表；株距、施肥、採收天數等基本欄位仍缺，需另行查證。"}, {"id": 19, "crop_id": "sigua", "note": "白粉病是絲瓜另一常見病害（防治方法包含田區衛生管理、輪流用藥），黑守瓜為常見蟲害（可於苗期覆蓋紗網防治），本次因未透過WebFetch查證到完整原文防治細節，暫未收錄，需另行查證。"}, {"id": 20, "crop_id": "sijidou", "note": "銹病、白粉病、灰黴病、葉蟎、潛葉蠅等在搜尋結果中被列為四季豆常見病蟲害，但本次未查證到症狀與防治方法的官方原文，需另行查證；適合季節、溫度、土壤等基本欄位亦缺。"}, {"id": 21, "crop_id": "bale", "note": "立枯病、藻斑病、煤煙病、莖潰瘍病、枝枯病、粉介殼蟲、線蟲病害、腹鉤薊馬、黑疣粉蝨、捲葉蛾等在芭樂主題館中均有專頁，本次僅查證東方果實蠅一項，其餘需視需求後續補齊；定植季節的月份是排除典型雨季/颱風季後的推算值，非原文直接給出的月份，需另行查證核實。"}, {"id": 22, "crop_id": "bocai", "note": "本筆資料來自通俗種植教學（使用者問答等級），適合溫度、株距、明確採收天數等欄位缺失，需另尋台灣官方栽培曆（如農業改良場）補齊並交叉核對。"}, {"id": 23, "crop_id": "jielan", "note": "本筆資料來自通俗種植教學，內容偏向一般性園藝建議（非明確標示台灣在地技術資料），黑腐病、菜青蟲等病蟲害細節也僅有簡略描述，需另尋台灣官方芥藍栽培資料（如十字花科相關主題館）補齊並交叉核對。"}, {"id": 24, "crop_id": "donggua", "note": "適合季節、溫度、土壤、株距、水分管理、採收天數等基本欄位均缺，本次僅查得摘心整枝與施肥細節；病蟲害資料（露菌病、疫病、蚜蟲等常見問題）本次未查證到官方原文，需另行查證。"}, {"id": 25, "crop_id": "nangua", "note": "南瓜主題館雖有官方分區季節資料，但採收天數、株距、施肥等仍缺，本次以使用者問答補充部分資訊（已標記qa）；病蟲害僅查得果實蠅與潛葉蟲兩項使用者問答內容，白粉病、露菌病等常見病害尚未查證。"}, {"id": 26, "crop_id": "kugua", "note": "官方苦瓜主題館資料完整度高，但本次未收錄「苦瓜育苗技術與苗期管理」（發芽溫度30～35℃已知，其餘苗期細節未查證）及萎凋病以外的症狀描述，需視需求後續補齊。"}, {"id": 27, "crop_id": "azhai", "note": "溫度、土壤、水分管理、施肥等基本欄位尚未取得；病蟲害資料亦尚未查證，需另行補齊。"}, {"id": 28, "crop_id": "yutou", "note": "適合季節資料品質偏通俗教學（qa等級），溫度、土壤、株距、施肥等欄位均缺，需另尋官方芋頭栽培曆補齊並交叉核對；病蟲害資料則已有官方主題館的完整4項。"}, {"id": 29, "crop_id": "jiang", "note": "資料來源頁面（knowledge_view id=4362）內容雖詳實具體，但無法確認是否為官方發布或轉載自其他來源，建議之後與苗栗、花蓮等主要薑產區的農業改良場資料交叉核對；青枯病與軟腐病已補上症狀說明，但白絹病、根瘤線蟲、疫病仍僅有病名，防治方法多僅提及「參考植物保護手冊」缺乏具體藥劑，需另行補齊。"}, {"id": 30, "crop_id": "wandou", "note": "「平地」與「高冷地」栽培期未明確對應台灣哪些縣市/地區，暫套用平地期作為北中南通用值，需另行查證高冷地栽培的實際地理範圍；病蟲害資料尚未查證。"}, {"id": 31, "crop_id": "maodou", "note": "本次僅查得全國產期與主要產地，播種月份、株距、溫度、施肥等栽培細節與病蟲害資料均尚未查證，需另行補齊。"}, {"id": 32, "crop_id": "ganju", "note": "本次查得各柑橘品種的產期與傳統主產地，但溫度、土壤、栽培管理、病蟲害等細節尚未查證；「地區」為品種主產地而非播種季節，與蔬菜類的「現在適合種」邏輯不同，需在UI呈現時特別區分，避免使用者誤解為可播種月份。"}, {"id": 33, "crop_id": "mangguo", "note": "苗木定植適期(3～10月)已透過WebFetch核實官方頁面，炭疽病病蟲害資料亦已補齊；適合溫度、土壤（除定植方式外）、株距等資料，以及薊馬、介殼蟲、東方果實蠅等其餘蟲害資料仍尚未查證。"}, {"id": 34, "crop_id": "mugua", "note": "定植適期(春植2～3月/秋植9～11月)已透過WebFetch核實食農教育資訊整合平臺頁面；適合溫度、病蟲害資料仍尚未查證。"}, {"id": 35, "crop_id": "fengli", "note": "溫度、土壤、株距（僅有種植密度）、病蟲害等資料均尚未查證；種植時間需依目標採收月份與芽種類反推計算，不適合簡化成單一月份範圍，需另行設計更複雜的判斷邏輯。"}, {"id": 36, "crop_id": "lianwu", "note": "適合溫度、株距為既有果樹的栽培參數，土壤、施肥細節已有基本資料，但病蟲害資料尚未查證；「苗木定植季節」與蔬菜播種季節的意義不同，需在UI呈現時說明清楚。"}, {"id": 37, "crop_id": "yumi", "note": "僅查得南部播種期，北部、中部播種期尚未查證；土壤、水分管理、施肥、病蟲害等資料均尚未查證。"}, {"id": 38, "crop_id": "digua", "note": "本次資料聚焦於插植適期與株距，土壤條件、施肥、病蟲害等細節尚未查證（可參考同屬甘藷科的地瓜葉病蟲害資料，如甘藷蟻象、甘藷猿葉蟲、甘藷簇葉病，但需確認是否適用於採收塊根的地瓜栽培情境）。"}, {"id": 39, "crop_id": "xiangjiao", "note": "適合種植季節多次查證仍未找到官方明確月份（僅查到「產期」依吸芽發生月份分春蕉3-5月/夏蕉6-9月/秋冬蕉10月至翌年2月採收，但這是採收期非種植期），season欄位誠實留空；溫度、土壤等基本欄位亦缺；病蟲害資料（嵌紋病、萎縮病、黃葉病、球莖象鼻蟲、假莖象鼻蟲、花薊馬等）本次僅查得名稱列表，未查證症狀與防治方法原文，需另行補齊。"}, {"id": 40, "crop_id": "lvhuaqielan", "note": "本次查詢多次仍未取得青花菜專屬的官方栽培資料，查到的頁面實際為花椰菜（白花）內容，已明確標記警示不作為青花菜正式數據；建議下次直接搜尋「綠花椰菜」或指定青花菜主題館頁面ID查證。"}, {"id": 41, "crop_id": "jiucai", "note": "溫度以外的土壤、株距、水分管理、施肥細節（除花蓮區合理化施肥概述）尚未完整查證；薊馬與白絹病已補上症狀與防治方法，銹病等其餘病蟲害仍待補齊。"}, {"id": 42, "crop_id": "cong", "note": "紫斑病已補上症狀與病原菌說明，但防治方法僅提及「參考植保手冊」缺乏具體藥劑；菌核病、赤銹病、甜菜夜蛾、潛蠅等其餘病蟲害本次僅查得名稱列表，需另行補齊。"}, {"id": 43, "crop_id": "dasuan", "note": "病蟲害資料（萎黃病、細菌性軟腐病、蔥潛蠅等）本次僅查得名稱列表，未查證症狀與防治方法原文，需另行補齊。"}, {"id": 44, "crop_id": "xigua", "note": "銀葉粉蝨病蟲害資料已補齊；土壤、種植方式、株距、施肥等栽培細節，以及蔓枯病等其餘病蟲害仍尚未查證；北部、中部分區資料亦缺，需另行補齊。"}, {"id": 45, "crop_id": "jiecai", "note": "株距、採收天數尚未取得；病蟲害資料（嵌紋病毒、軟腐病、黑腐病、根瘤病、露菌病、蚜蟲類、斜紋夜蛾、紋白蝶、小菜蛾、黃條葉蚤）本次僅查得名稱列表，未查證症狀與防治方法原文，需另行補齊。"}, {"id": 46, "crop_id": "youcai", "note": "季節資料僅以台東地區為例，全台適用性未查證；土壤、種植方式、株距、採收天數、病蟲害等資料均缺，需另行補齊。油菜常作為綠肥/景觀作物而非食用蔬菜栽培，用途定位需在UI呈現時說明清楚。"}, {"id": 47, "crop_id": "lizhi", "note": "適合溫度、土壤條件（除定植植穴處理）等基本欄位尚未取得；病蟲害資料（荔枝椿象、荔枝細蛾、炭疽病等常見問題）本次未查證，需另行補齊。"}, {"id": 48, "crop_id": "longyan", "note": "適合溫度、土壤條件、株距等新植栽培資料尚未取得；病蟲害資料（荔枝椿象、木蝨、炭疽病等）本次未查證，需另行補齊。"}, {"id": 49, "crop_id": "baixiangguo", "note": "適合溫度、土壤條件、株距等資料尚未取得；病蟲害資料（褐色圓斑病、木質化病毒病、東方果實蠅等）本次未查證，需另行補齊。"}, {"id": 50, "crop_id": "huolongguo", "note": "扦插/種植的確切適合季節本次未能以WebFetch查證單一官方來源，season欄位暫留空，之後應直接搜尋台灣農業改良場（如台南區、高雄區）的紅龍果專頁補齊；株距、施肥週期、病蟲害資料亦尚未完整查證。"}, {"id": 51, "crop_id": "shanyao", "note": "施肥資料與北部以外地區的病蟲害資料尚未查證；中南部分區種植資料亦缺，需另行補齊。"}, {"id": 52, "crop_id": "niupang", "note": "本筆資料來自通俗種植教學（qa等級），非直接來自台灣官方牛蒡主題館，株距、施肥、水分管理、病蟲害等資料均缺，需另行查證並替換為官方來源。"}, {"id": 53, "crop_id": "lusun", "note": "土壤條件、水分管理、施肥等基本欄位尚未取得；病蟲害資料（蘆筍莖枯病、蘆筍夜蛾等）本次未查證症狀與防治方法原文，需另行補齊。"}, {"id": 54, "crop_id": "jiaobaisun", "note": "分株定植的確切月份原文未提供，season欄位暫留空；施肥、病蟲害資料（黑穗病等）本次未完整查證，需另行補齊。"}, {"id": 55, "crop_id": "hongdou", "note": "適合溫度、土壤、株距、施肥等基本欄位尚未取得；病蟲害資料本次未查證，需另行補齊；北部、中部是否適合栽培及原因尚待查證（官方資料僅強調南部秋作為主）。"}, {"id": 56, "crop_id": "huasheng", "note": "播種月份是根據「農曆採收期＋成長期4個月」反推估算，並非原文直接給出的播種月份，需另行查證官方播種曆核實；銹病與白絹病病害資料已補齊，但土壤條件（除排水良好砂質壤土）、株距、施肥，以及紅蜘蛛、小綠葉蟬等蟲害資料仍尚未完整查證。"}, {"id": 57, "crop_id": "putao", "note": "本次資料聚焦於既有植株的產期調節模式，新植苗木的種植月份、適合溫度、土壤、株距等基本欄位尚未取得；病蟲害資料（露菌病、黑痘病、金龜子等）本次未查證，需另行補齊。"}, {"id": 58, "crop_id": "caomei", "note": "產地分布（大湖、內湖等主要產區）本次未查得官方原文佐證；病蟲害資料（灰黴病、白粉病、紅蜘蛛等）本次未查證，需另行補齊。"}, {"id": 59, "crop_id": "qiukui", "note": "北中南分區月份是根據搜尋摘要整理而非單一WebFetch核實頁面，需另行以官方分區栽培曆核對；病蟲害資料（二點小綠葉蟬、棉蚜、南黃薊馬、潛蠅、白粉病、病毒病）本次僅查得名稱列表，未查證症狀與防治方法原文。"}, {"id": 60, "crop_id": "huanggongcai", "note": "整體資料品質偏通俗種植教學（qa等級），適合溫度、土壤、株距等基本欄位缺，需另尋官方落葵/保健植物主題館資料補齊並交叉核對；病蟲害資料未查證（原文提及對病蟲害抵抗力強，栽培期間可不用農藥，但缺乏具體病蟲害清單）。"}, {"id": 61, "crop_id": "jiucengta", "note": "整體資料品質偏通俗種植教學（qa等級），土壤pH、株距、施肥等基本欄位缺，需另尋官方羅勒/香草植物主題館資料補齊；病蟲害資料未查證。"}, {"id": 62, "crop_id": "xiangcai", "note": "整體資料品質偏通俗種植教學（qa等級），土壤條件、株距、施肥等基本欄位缺，需另尋官方芫荽栽培資料補齊；病蟲害資料未查證。"}, {"id": 63, "crop_id": "lianou", "note": "水分管理（除萌芽生長溫度外）、施肥等細節尚未取得；病蟲害資料本次未查證，需另行補齊。"}, {"id": 64, "crop_id": "yangtao", "note": const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function srcCell(r) {
  return `<div class="src-cell">
    <a class="src-link" href="${r.source_url}" target="_blank" rel="noopener">${esc(r.source_name)} ↗</a>
    <span class="src-date">${r.fetched_date} <span class="badge ${r.source_type}">${r.source_type}</span></span>
  </div>`;
}

function renderCrop(cropId) {
  const crop = DATA.crops.find(c => c.crop_id === cropId);
  const cultivation = DATA.cultivation.filter(r => r.crop_id === cropId);
  const pests = DATA.pests.filter(r => r.crop_id === cropId);
  const notes = DATA.notes.filter(r => r.crop_id === cropId);

  const regions = (crop.region_north || crop.region_central || crop.region_south)
    ? `<div class="regions">
        <div class="region-cell"><span class="r-label">北部</span><span class="r-text">${esc(crop.region_north) || "尚無資料"}</span></div>
        <div class="region-cell"><span class="r-label">中部</span><span class="r-text">${esc(crop.region_central) || "尚無資料"}</span></div>
        <div class="region-cell"><span class="r-label">南部</span><span class="r-text">${esc(crop.region_south) || "尚無資料"}</span></div>
        <div class="region-note">${esc(crop.region_note)}</div>
      </div>`
    : `<div class="regions"><div class="region-note" style="grid-column:1/-1;border-top:none;">${esc(crop.region_note)}</div></div>`;

  const cultRows = cultivation.map(r => `
    <div class="fact-card">
      <div class="fact-field">${esc(r.field)}</div>
      <div class="fact-value">${esc(r.value)}</div>
      ${srcCell(r)}
    </div>`).join("") || `<p class="fact-empty">尚無資料</p>`;

  const pestRows = pests.map(r => `
    <div class="fact-card">
      <div class="fact-field pest-name">${esc(r.name)}</div>
      <div class="fact-row"><span class="fact-label">症狀</span><span class="fact-value">${esc(r.symptom)}</span></div>
      <div class="fact-row"><span class="fact-label">防治方法</span><span class="fact-value">${esc(r.control)}</span></div>
      ${srcCell(r)}
    </div>`).join("") || `<p class="fact-empty">尚無資料</p>`;

  const notesBlock = notes.length ? `
    <div class="unverified">
      <span class="head">未查證 · 需人工補查</span>
      <ul>${notes.map(n => `<li>${esc(n.note)}</li>`).join("")}</ul>
    </div>` : "";

  document.getElementById("sheet").innerHTML = `
    <button class="back-btn" id="cropBack" type="button">← 返回</button>
    <div class="masthead">
      <div>
        <span class="id">CROP-ID · ${esc(crop.crop_id).toUpperCase()}</span>
        <h1 class="crop-name">${esc(crop.name)}</h1>
      </div>
      <span class="category-chip">${esc(crop.category)}</span>
    </div>
    ${regions}
    <section class="block">
      <h2 class="block-title">栽培條件 <span class="count">${cultivation.length} 項</span></h2>
      <div class="fact-list">${cultRows}</div>
    </section>
    <section class="block">
      <h2 class="block-title">病蟲害與防治 <span class="count">${pests.length} 項</span></h2>
      <div class="fact-list">${pestRows}</div>
    </section>
    ${notesBlock}
  `;
  document.getElementById("cropBack").addEventListener("click", showHome);
}

// 24節氣的近似固定日期（誤差通常在±1天內，農業應用足夠精確；非精確天文計算）
const SOLAR_TERMS = [
  [1,6,"小寒"], [1,20,"大寒"], [2,4,"立春"], [2,19,"雨水"],
  [3,6,"驚蟄"], [3,21,"春分"], [4,5,"清明"], [4,20,"穀雨"],
  [5,6,"立夏"], [5,21,"小滿"], [6,6,"芒種"], [6,21,"夏至"],
  [7,7,"小暑"], [7,23,"大暑"], [8,8,"立秋"], [8,23,"處暑"],
  [9,8,"白露"], [9,23,"秋分"], [10,8,"寒露"], [10,24,"霜降"],
  [11,7,"立冬"], [11,22,"小雪"], [12,7,"大雪"], [12,22,"冬至"],
];
// 節氣四立劃分的季節（農民曆習慣：立春起為春，立夏起為夏，立秋起為秋，立冬起為冬）
const QUARTER_SEASON = { "立春":"春","立夏":"夏","立秋":"秋","立冬":"冬" };

function getSeasonInfo(date) {
  const y = date.getFullYear();
  const todayMid = new Date(y, date.getMonth(), date.getDate());

  let currentIdx = -1;
  for (let i = 0; i < SOLAR_TERMS.length; i++) {
    const [tm, td] = SOLAR_TERMS[i];
    if (new Date(y, tm - 1, td) <= todayMid) currentIdx = i; else break;
  }

  let currentTermDate;
  if (currentIdx === -1) {
    // 今年1月6日（小寒）之前，目前所屬節氣為去年12月22日的冬至
    currentIdx = SOLAR_TERMS.length - 1;
    const [tm, td] = SOLAR_TERMS[currentIdx];
    currentTermDate = new Date(y - 1, tm - 1, td);
  } else {
    const [tm, td] = SOLAR_TERMS[currentIdx];
    currentTermDate = new Date(y, tm - 1, td);
  }

  const nextIdx = (currentIdx + 1) % SOLAR_TERMS.length;
  const [ntm, ntd] = SOLAR_TERMS[nextIdx];
  const nextDate = new Date(currentTermDate.getFullYear() + (nextIdx === 0 ? 1 : 0), ntm - 1, ntd);
  const daysUntilNext = Math.round((nextDate - todayMid) / 86400000);

  let season = "冬";
  for (let i = currentIdx; i >= 0; i--) {
    if (QUARTER_SEASON[SOLAR_TERMS[i][2]]) { season = QUARTER_SEASON[SOLAR_TERMS[i][2]]; break; }
  }

  return { currentTerm: SOLAR_TERMS[currentIdx][2], nextTerm: SOLAR_TERMS[nextIdx][2], daysUntilNext, season };
}

function renderSeasonBar() {
  const now = new Date();
  const info = getSeasonInfo(now);
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  document.getElementById("seasonBar").innerHTML = `
    <span class="sb-date">${dateStr}</span>
    <span>節氣季節：<strong>${info.season}</strong></span>
    <span class="sb-sep">·</span>
    <span>目前節氣：<span class="sb-term">${info.currentTerm}</span></span>
    <span class="sb-sep">·</span>
    <span class="sb-next">距下一節氣「${info.nextTerm}」還有 ${info.daysUntilNext} 天</span>
  `;
}

const MONTH_NAMES = ["","1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const REGION_LABEL = { north: "北部", central: "中部", south: "南部" };
let CURRENT_REGION = "central";
let CURRENT_VIEW = "__now__";

function seasonMonthsFor(crop, region) {
  const raw = crop["season_months_" + region];
  return raw ? raw.split(",").map(Number) : null;
}

const CATEGORY_ORDER = ["葉菜類", "花菜類", "根莖類", "果菜類", "豆菜類", "蔥蒜類", "雜糧", "果樹"];

function renderNow() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const collected = DATA.crops;
  const suitable = collected.filter(c => {
    const months = seasonMonthsFor(c, CURRENT_REGION);
    return months && months.includes(month);
  });
  const noData = collected.filter(c => !seasonMonthsFor(c, CURRENT_REGION));

  const byCategory = {};
  suitable.forEach(c => { (byCategory[c.category] ||= []).push(c); });
  const categories = Object.keys(byCategory).sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  const groupsHtml = categories.map(cat => `
    <section class="now-category">
      <h2 class="now-cat-title">${esc(cat)} <span class="count">${byCategory[cat].length} 種</span></h2>
      <div class="now-grid">
        ${byCategory[cat].map(c => `
          <button class="now-card" data-id="${c.crop_id}">
            <div class="nc-top"><span class="nc-name">${esc(c.name)}</span></div>
            <div class="nc-season">${esc(c.season_label)}</div>
            <span class="nc-arrow">查看栽培方法 →</span>
          </button>`).join("")}
      </div>
    </section>`).join("");

  const emptyMsg = suitable.length === 0
    ? `<p style="color:var(--ink-soft);font-size:0.88rem">目前資料庫中，${REGION_LABEL[CURRENT_REGION]}在${month}月還沒有標記為適合種植的作物（可能是月份剛好落在空檔，或資料尚未蒐集齊全）。</p>`
    : "";

  const pendingChips = noData.length
    ? `<div class="registry-group" style="margin-top:0.5rem">
        <h3>季節資料待補查（已蒐集其他欄位，但月份尚未確認）</h3>
        <div class="pending-list">${noData.map(c => `<span class="pending-chip">${esc(c.name)}</span>`).join("")}</div>
      </div>`
    : "";

  const nextMonth = (month % 12) + 1;
  const suitableNext = collected.filter(c => {
    const months = seasonMonthsFor(c, CURRENT_REGION);
    return months && months.includes(nextMonth) && !months.includes(month);
  });
  const upcomingSection = suitableNext.length
    ? `<section class="upcoming-block">
        <h2 class="now-cat-title" style="border-bottom:none;padding-bottom:0">🔜 下個月（${MONTH_NAMES[nextMonth]}）開始適合種 <span class="count">先準備 ${suitableNext.length} 種</span></h2>
        <div class="now-grid">
          ${suitableNext.map(c => `
            <button class="now-card upcoming" data-id="${c.crop_id}">
              <div class="nc-top"><span class="nc-name">${esc(c.name)}</span><span class="nc-cat">${esc(c.category)}</span></div>
              <div class="nc-season">${esc(c.season_label)}</div>
              <span class="nc-arrow">查看栽培方法 →</span>
            </button>`).join("")}
        </div>
      </section>`
    : "";

  document.getElementById("sheet").innerHTML = `
    <div class="now-head">
      <span class="month">${month}月・${REGION_LABEL[CURRENT_REGION]}適合種的作物</span>
      <span class="sub">共 ${suitable.length} 種，分 ${categories.length} 類（資料庫目前僅收錄 ${collected.length} 種作物的完整資料，持續蒐集中）</span>
    </div>
    ${emptyMsg}
    ${groupsHtml}
    ${upcomingSection}
    ${pendingChips}
  `;
  document.querySelectorAll(".now-card").forEach(card => {
    card.addEventListener("click", () => showCrop(card.dataset.id));
  });
}

function renderRegionTabs() {
  const el = document.getElementById("regionTabs");
  el.innerHTML = Object.entries(REGION_LABEL).map(([key, label]) =>
    `<button class="tab" role="tab" data-region="${key}" aria-selected="${key === CURRENT_REGION}">${label}</button>`).join("");
  el.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      CURRENT_REGION = btn.dataset.region;
      el.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", "false"));
      btn.setAttribute("aria-selected", "true");
      if (CURRENT_VIEW === "__now__") renderNow();
    });
  });
}

function showHome() {
  CURRENT_VIEW = "__now__";
  renderNow();
}

function showCrop(id) {
  CURRENT_VIEW = id;
  renderCrop(id);
}

function showAllList() {
  CURRENT_VIEW = "__registry__";
  renderRegistry();
}

document.getElementById("brandBtn").addEventListener("click", showHome);
document.getElementById("allCropsBtn").addEventListener("click", showAllList);

renderSeasonBar();
renderRegionTabs();
renderNow();
</script>
